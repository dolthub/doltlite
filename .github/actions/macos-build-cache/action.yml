name: macOS build cache
description: Cache compiler outputs for one build configuration.
inputs:
  configuration:
    required: true
    description: Build configuration
  cflags:
    required: true
    description: Compiler flags
  ldflags:
    default: ''
    description: Linker flags
outputs:
  cache-hit:
    description: Whether this revision was already cached
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
  - name: Identify compiler cache
    id: identity
    shell: bash
    env:
      CACHE_BUILD_CONFIGURATION: ${{ inputs.configuration }}
      CACHE_BUILD_CFLAGS: ${{ inputs.cflags }}
      CACHE_BUILD_LDFLAGS: ${{ inputs.ldflags }}
    run: |
      brew install ccache
      key=$(bash .github/scripts/macos-build-cache-key.sh)
      echo "key=$key" >> "$GITHUB_OUTPUT"
      {
        echo "CCACHE_DIR=$RUNNER_TEMP/doltlite-${{ inputs.configuration }}-ccache"
        echo "CCACHE_MAXSIZE=256M"
        echo "CCACHE_COMPILERCHECK=content"
        echo "DOLTLITE_COMPILER_CACHE_KEY=macos-build-v1-${{ runner.arch }}-$key-${{ github.sha }}"
      } >> "$GITHUB_ENV"
  - name: Restore compiler cache
    id: cache
    uses: actions/cache/restore@v4
    with:
      path: ${{ env.CCACHE_DIR }}
      key: ${{ env.DOLTLITE_COMPILER_CACHE_KEY }}
      restore-keys: |
        macos-build-v1-${{ runner.arch }}-${{ steps.identity.outputs.key }}-
  - name: Reset compiler statistics
    shell: bash
    run: |
      ccache --zero-stats
      echo "DOLTLITE_COMPILER_CACHE_HIT=${{ steps.cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
