name: asan-build
description: Build CI artifacts with the existing platform configuration.
inputs:
  platform:
    description: Target runner platform
    required: true
runs:
  using: composite
  steps:
  - name: Install Linux dependencies
    if: inputs.platform == 'ubuntu'
    run: |
      bash .github/scripts/install-apt-deps.sh \
        build-essential tcl-dev zlib1g-dev
    shell: bash -e {0}
  - name: Install macOS dependencies
    if: inputs.platform == 'macos'
    run: brew install tcl-tk
    shell: bash -e {0}
  - name: Cache macOS compiler outputs
    if: inputs.platform == 'macos'
    uses: ./.github/actions/macos-build-cache
    with:
      configuration: asan
      cflags: ${{ env.ASAN_CFLAGS }}
      ldflags: ${{ env.ASAN_LDFLAGS }}
  - name: Configure
    run: |
      mkdir -p build
      cd build
      if [ "${{ inputs.platform }}" = "macos" ]; then
        source ../.github/scripts/use-macos-compiler-cache.sh
        export PATH="$(brew --prefix tcl-tk)/bin:$PATH"
        ../configure
      else
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi
      fi
    shell: bash -e {0}
  - name: Build
    run: |
      set -eo pipefail
      cd build
      make_jobs=(-j2)
      if [ "${{ inputs.platform }}" = "macos" ]; then
        source ../.github/scripts/use-macos-compiler-cache.sh
        make_jobs=(-j"$(sysctl -n hw.logicalcpu)")
      fi
      {
        make "${make_jobs[@]}" CFLAGS="$ASAN_CFLAGS" LDFLAGS="$ASAN_LDFLAGS" \
          doltlite libdoltlite.a
        make DOLTLITE_PROLLY=0 sqlite3
        cc $ASAN_CFLAGS -I. -I../src \
          -o doltlite_regression_test_c \
          ../test/doltlite_regression_test_c.c \
          libdoltlite.a $ASAN_LDFLAGS -lz -lpthread -lm
      } 2>&1 | tee build.log
      if grep -E "warning:" build.log; then
        echo "::error::compiler warnings in sanitizer build"
        exit 1
      fi
    shell: bash -e {0}
  - name: Verify compiler cache
    if: inputs.platform == 'macos'
    shell: bash
    run: bash .github/scripts/check-compiler-cache.sh
  - name: Save compiler cache
    if: inputs.platform == 'macos'
    uses: ./.github/actions/save-macos-build-cache
  - name: Package
    run: |
      bash .github/scripts/package-ci-build.sh asan-ubsan-${{ inputs.platform }}.tar.gz \
        build/doltlite build/sqlite3 build/doltlite_regression_test_c \
        build/libdoltlite.a build/sqlite3.h build/build.log
    shell: bash -e {0}
  - name: Upload
    uses: actions/upload-artifact@v4
    with:
      name: asan-ubsan-${{ inputs.platform }}
      path: asan-ubsan-${{ inputs.platform }}.tar.gz
      compression-level: 0
      retention-days: 1
