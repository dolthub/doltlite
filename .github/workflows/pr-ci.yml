name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.files.outputs.docs_changed }}
      light: ${{ steps.files.outputs.light }}
      suites: ${{ steps.files.outputs.suites }}
      platforms: ${{ steps.files.outputs.platforms }}
      benchmarks: ${{ steps.files.outputs.benchmarks }}
      compile: ${{ steps.files.outputs.compile }}
      wasm: ${{ steps.files.outputs.wasm }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: files
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/classify-changes.js').run({github, context, core});

  doc_links:
    name: Docs validation
    needs: classify
    if: needs.classify.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash test/doc_links_test.sh
      - run: bash test/doc_error_strings_test.sh
      - name: Build doltlite
        if: needs.classify.outputs.light != 'true'
        run: |
          bash .github/scripts/install-apt-deps.sh build-essential tcl-dev zlib1g-dev
          mkdir -p build && cd build
          TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
          ../configure ${TCL_CONFIG:+--with-tcl=$(dirname "$TCL_CONFIG")} >/dev/null
          make -j"$(nproc)" doltlite
      - if: needs.classify.outputs.light != 'true'
        run: bash test/oracle_doc_examples_test.sh build/doltlite
      - if: needs.classify.outputs.light != 'true'
        run: bash test/doc_examples_selftest.sh build/doltlite
      - if: needs.classify.outputs.light != 'true'
        run: bash test/oracle_doc_agent_guide_test.sh build/doltlite
      - if: needs.classify.outputs.light != 'true'
        run: |
          bash test/sqlite_compatibility_contract_test.sh build/doltlite
          bash test/concurrency_contract_test.sh build/doltlite
          bash test/storage_format_contract_test.sh build/doltlite

  build_ubuntu:
    name: build-ubuntu
    needs: classify
    if: needs.classify.outputs.light != 'true'
    uses: ./.github/workflows/ci-build.yml
    with:
      suites: ${{ needs.classify.outputs.suites == 'true' }}
      benchmarks: ${{ needs.classify.outputs.benchmarks == 'true' }}

  test_ubuntu:
    name: test-ubuntu
    needs: [classify, build_ubuntu]
    if: needs.classify.outputs.suites == 'true' || needs.classify.outputs.platforms == 'true' || needs.classify.outputs.benchmarks == 'true'
    uses: ./.github/workflows/ubuntu-test.yml
    with:
      suites: ${{ needs.classify.outputs.suites == 'true' }}
      platforms: ${{ needs.classify.outputs.platforms == 'true' }}
      benchmarks: ${{ needs.classify.outputs.benchmarks == 'true' }}

  compile_checks:
    name: compile-checks
    needs: classify
    if: needs.classify.outputs.compile == 'true'
    uses: ./.github/workflows/compile-checks.yml

  wasm:
    name: wasm
    needs: classify
    if: needs.classify.outputs.wasm == 'true'
    uses: ./.github/workflows/wasm.yml

  build_macos:
    name: build-macos
    needs: classify
    if: needs.classify.outputs.platforms == 'true'
    uses: ./.github/workflows/macos-build.yml

  test_macos:
    name: test-macos
    needs: [classify, build_macos]
    if: needs.classify.outputs.platforms == 'true'
    uses: ./.github/workflows/macos-test.yml

  build_windows:
    name: build-windows
    needs: classify
    if: needs.classify.outputs.platforms == 'true'
    uses: ./.github/workflows/checked-build.yml
    with:
      platform: windows

  test_windows:
    name: test-windows
    needs: [classify, build_windows]
    if: needs.classify.outputs.platforms == 'true'
    uses: ./.github/workflows/platform-test.yml
    with:
      platform: windows

  windows_suites:
    name: windows-suites
    needs: [classify, build_windows]
    if: needs.classify.outputs.platforms == 'true'
    uses: ./.github/workflows/windows-suites.yml

  # A job the classifier left out must have been skipped; one it asked for
  # must have succeeded. Skipping is only ever accepted by this rule.
  gate:
    name: CI Gate
    needs: [classify, doc_links, build_ubuntu, test_ubuntu, compile_checks, wasm, build_macos, test_macos, build_windows, test_windows, windows_suites]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - env:
          CLASSIFY: ${{ needs.classify.result }}
          LIGHT: ${{ needs.classify.outputs.light }}
          SUITES: ${{ needs.classify.outputs.suites }}
          PLATFORMS: ${{ needs.classify.outputs.platforms }}
          BENCHMARKS: ${{ needs.classify.outputs.benchmarks }}
          COMPILE: ${{ needs.classify.outputs.compile }}
          WASM_WANTED: ${{ needs.classify.outputs.wasm }}
          DOC_LINKS: ${{ needs.doc_links.result }}
          BUILD_UBUNTU: ${{ needs.build_ubuntu.result }}
          TEST_UBUNTU: ${{ needs.test_ubuntu.result }}
          COMPILE_CHECKS: ${{ needs.compile_checks.result }}
          WASM: ${{ needs.wasm.result }}
          BUILD_MACOS: ${{ needs.build_macos.result }}
          TEST_MACOS: ${{ needs.test_macos.result }}
          BUILD_WINDOWS: ${{ needs.build_windows.result }}
          TEST_WINDOWS: ${{ needs.test_windows.result }}
          WINDOWS_SUITES: ${{ needs.windows_suites.result }}
        run: bash .github/scripts/ci-gate.sh
