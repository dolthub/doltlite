name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.files.outputs.docs_changed }}
      light: ${{ steps.files.outputs.light }}
    steps:
      - id: files
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull) {
              core.setOutput('docs_changed', 'true');
              core.setOutput('light', 'false');
              return;
            }
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                per_page: 100,
              }
            );
            core.setOutput(
              'docs_changed',
              String(files.some(file => file.filename.endsWith('.md')))
            );
            // The repo README and the rolling performance report are not
            // engine or doc-reference surfaces: they only need the link check.
            const light = new Set(['README.md', 'performance-report.md']);
            core.setOutput(
              'light',
              String(files.length > 0 && files.every(file => light.has(file.filename)))
            );

  doc_links:
    name: Docs validation
    needs: classify
    if: needs.classify.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash test/doc_links_test.sh
      - run: bash test/doc_error_strings_test.sh
      - name: Build doltlite
        if: needs.classify.outputs.light != 'true'
        run: |
          bash .github/scripts/install-apt-deps.sh build-essential tcl-dev zlib1g-dev
          mkdir -p build && cd build
          TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
          ../configure ${TCL_CONFIG:+--with-tcl=$(dirname "$TCL_CONFIG")} >/dev/null
          make -j"$(nproc)" doltlite
      - if: needs.classify.outputs.light != 'true'
        run: bash test/oracle_doc_examples_test.sh build/doltlite
      - if: needs.classify.outputs.light != 'true'
        run: bash test/doc_examples_selftest.sh build/doltlite
      - if: needs.classify.outputs.light != 'true'
        run: bash test/oracle_doc_agent_guide_test.sh build/doltlite

  build_ubuntu:
    name: build-ubuntu
    needs: classify
    if: needs.classify.outputs.light != 'true'
    uses: ./.github/workflows/ci-build.yml

  test_ubuntu:
    name: test-ubuntu
    needs: [classify, build_ubuntu]
    if: needs.classify.outputs.light != 'true'
    uses: ./.github/workflows/ubuntu-test.yml

  build_macos:
    name: build-macos
    needs: classify
    if: needs.classify.outputs.light != 'true'
    uses: ./.github/workflows/macos-build.yml

  test_macos:
    name: test-macos
    needs: [classify, build_macos]
    if: needs.classify.outputs.light != 'true'
    uses: ./.github/workflows/macos-test.yml

  build_windows:
    name: build-windows
    needs: classify
    if: needs.classify.outputs.light != 'true'
    uses: ./.github/workflows/checked-build.yml
    with:
      platform: windows

  test_windows:
    name: test-windows
    needs: [classify, build_windows]
    if: needs.classify.outputs.light != 'true'
    uses: ./.github/workflows/platform-test.yml
    with:
      platform: windows

  gate:
    name: CI Gate
    needs: [classify, doc_links, build_ubuntu, test_ubuntu, build_macos, test_macos, build_windows, test_windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CLASSIFY: ${{ needs.classify.result }}
          LIGHT: ${{ needs.classify.outputs.light }}
          DOC_LINKS: ${{ needs.doc_links.result }}
          BUILD_UBUNTU: ${{ needs.build_ubuntu.result }}
          TEST_UBUNTU: ${{ needs.test_ubuntu.result }}
          BUILD_MACOS: ${{ needs.build_macos.result }}
          TEST_MACOS: ${{ needs.test_macos.result }}
          BUILD_WINDOWS: ${{ needs.build_windows.result }}
          TEST_WINDOWS: ${{ needs.test_windows.result }}
        run: |
          test "$CLASSIFY" = success
          case "$DOC_LINKS" in success|skipped) ;; *) exit 1 ;; esac
          if [ "$LIGHT" = true ]; then
            exit 0
          fi
          for result in "$BUILD_UBUNTU" "$TEST_UBUNTU" "$BUILD_MACOS" "$TEST_MACOS" "$BUILD_WINDOWS" "$TEST_WINDOWS"; do
            test "$result" = success
          done
