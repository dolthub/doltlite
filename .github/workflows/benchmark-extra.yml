name: Benchmark Extra

# Companion to Benchmark. Runs the TEXT PK variant of the sysbench suite
# (test/sysbench_compare_textpk.sh) — every workload against tables with
# a 32-char hex TEXT PRIMARY KEY. Reporting only; no ceiling check until
# the non-INTKEY perf work brings ratios in.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -name tclConfig.sh 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Build doltlite and stock SQLite
      run: |
        cd build
        make doltlite
        make DOLTLITE_PROLLY=0 sqlite3

    - name: Run benchmarks
      id: bench
      run: |
        cd build
        # textpk script now enforces a 2× ceiling; capture its rc so we
        # can propagate it after the PR-comment step. Autocommit run is
        # reporting-only (sysbench_compare.sh skips ceiling on autocommit).
        set +e
        bash ../test/sysbench_compare_textpk.sh > /tmp/bench_textpk_results.md
        textpk_rc=$?
        BENCH_SECTION_MODE=autocommit bash ../test/sysbench_compare.sh > /tmp/bench_autocommit_results.md
        ac_rc=$?
        set -e
        # Concatenate into the file the comment step reads from, then
        # echo to the job log so results are visible on red builds.
        cat /tmp/bench_textpk_results.md /tmp/bench_autocommit_results.md > /tmp/bench_combined.md
        mv /tmp/bench_combined.md /tmp/bench_textpk_results.md
        cat /tmp/bench_textpk_results.md
        bench_rc=$textpk_rc
        if [ "$bench_rc" = "0" ]; then bench_rc=$ac_rc; fi
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Comment PR with results
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          // Read from file so the multi-line markdown (and any backticks /
          // template-literal-unsafe chars in it) never has to round-trip
          // through YAML scalars or JS template-literal parsing.
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/bench_textpk_results.md', 'utf8');

          if (!context.issue.number) {
            console.log('No PR context (push event) — skipping comment');
            return;
          }

          // Find existing benchmark-extra comment.
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.data.find(c =>
            c.body.includes('<!-- benchmark:textpk -->') ||
            c.body.includes('## Sysbench-Style Benchmark (TEXT PK): Doltlite vs SQLite')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }

    - name: Enforce ceiling
      run: |
        rc="${{ steps.bench.outputs.bench_rc }}"
        if [ "$rc" != "0" ]; then
          echo "Benchmark exceeded performance ceiling (rc=$rc)" >&2
          exit "$rc"
        fi
