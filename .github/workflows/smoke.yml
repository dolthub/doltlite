name: Smoke

on:
  workflow_call:

jobs:
  vc-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh zlib1g-dev python3

    - name: Download checked build
      uses: actions/download-artifact@v4
      with:
        name: checked-build-ubuntu

    - name: Extract checked build
      run: tar -xzf checked-build-ubuntu.tar.gz

    - name: Run stateful version-control fuzzer
      run: |
        cd build
        DOLTLITE_VC_STATEFUL_SECONDS=600 bash ../test/vc_stateful_fuzzer.sh ./doltlite
      timeout-minutes: 12

  vc-model-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh zlib1g-dev gdb

    - name: Download checked build
      uses: actions/download-artifact@v4
      with:
        name: checked-build-ubuntu

    - name: Extract checked build
      run: tar -xzf checked-build-ubuntu.tar.gz

    # A wedged worker is attached to by gdb from a sibling process.
    - name: Allow stack capture of wedged workers
      run: sudo sysctl -w kernel.yama.ptrace_scope=0

    - name: Check model stress verdicts on recorded logs
      run: |
        cd build
        bash ../test/vc_model_stress_check_test.sh ./vc_model_stress_test ./doltlite

    - name: Run multi-process version-control model stress
      run: |
        cd build
        VCMODEL_SECONDS=600 VCMODEL_WEDGE_SEC=300 VCMODEL_PRELOG=1 \
        VCMODEL_OUT="$GITHUB_WORKSPACE/vc-model-stress" \
          bash ../test/vc_model_stress.sh ./vc_model_stress_test
      timeout-minutes: 22

    - name: Upload failing runs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: vc-model-stress-failures
        path: vc-model-stress/
        if-no-files-found: ignore
        retention-days: 14

  # Single sequential job — these checks are short individually and we'd
  # rather not fan out runners. Crash → history-independence → fuzz, each
  # with its own out-of-tree build dir so they don't trip over each other.
  crash-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh zlib1g-dev

    - name: Download checked build
      uses: actions/download-artifact@v4
      with:
        name: checked-build-ubuntu

    - name: Download crash build
      uses: actions/download-artifact@v4
      with:
        name: crash-build

    - name: Download libFuzzer build
      uses: actions/download-artifact@v4
      with:
        name: fuzz-build

    - name: Extract prebuilt binaries
      run: |
        tar -xzf checked-build-ubuntu.tar.gz
        tar -xzf crash-build.tar.gz
        tar -xzf fuzz-build.tar.gz

    # ── 1) crash-sqlite ──────────────────────────────────────────────
    - name: Native crash recovery test (SQLITE_TEST)
      run: |
        cd build-crash
        ./crash_recovery_test_sqlite_test

    - name: Crash injection durability test (SQLITE_TEST)
      run: |
        cd build-crash
        bash ../test/crash_injection_test.sh ./doltlite-crashtest

    # ── 2) history-independence ──────────────────────────────────────
    - name: History independence tests
      run: |
        cd build
        bash ../test/history_independence_test.sh ./doltlite

    # ── 3) fuzz-replaywal ────────────────────────────────────────────
    - name: Run csReplayWal fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_replaywal" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/replaywal" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run prolly_node fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_prolly_node" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/prolly_node" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run csDeserializeRefs fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_deserialize_refs" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/deserialize_refs" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run csReadIndex fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_read_index" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/read_index" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run deserializeCatalog fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_deserialize_catalog" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/deserialize_catalog" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run wire response fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_wire_response" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/wire_response" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run VC blob fuzzers (1m each)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        for target in commit working_set conflicts constraint_violations database; do
          "$GITHUB_WORKSPACE/build-fuzz/fuzz_$target" \
            "$GITHUB_WORKSPACE/test/fuzz-corpus/$target" \
            -max_total_time=60 \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -print_final_stats=1
        done

    - name: Upload fuzz crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: |
          crash-*
          leak-*
          timeout-*
        if-no-files-found: ignore
