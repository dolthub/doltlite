name: Smoke

on:
  pull_request:

jobs:
  vc-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.* 2>/dev/null || true; sudo apt-get update
        sudo apt-get install -y build-essential zlib1g-dev python3

    - name: Configure
      run: |
        mkdir -p build-vc-fuzz && cd build-vc-fuzz
        ../configure

    - name: Build DoltLite
      run: |
        cd build-vc-fuzz
        make DOLTLITE_PROLLY_CHECK=1 doltlite

    - name: Run stateful version-control fuzzer
      run: |
        cd build-vc-fuzz
        DOLTLITE_VC_STATEFUL_SECONDS=600 bash ../test/vc_stateful_fuzzer.sh ./doltlite
      timeout-minutes: 12

  # Single sequential job — these checks are short individually and we'd
  # rather not fan out runners. Crash → history-independence → fuzz, each
  # with its own out-of-tree build dir so they don't trip over each other.
  crash-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/azure-cli.* 2>/dev/null || true; sudo apt-get update
        sudo apt-get install -y tcl-dev libtommath-dev build-essential zlib1g-dev clang

    # ── 1) crash-sqlite ──────────────────────────────────────────────
    - name: Configure SQLITE_TEST build (build-crash)
      run: |
        mkdir -p build-crash && cd build-crash
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build crash-test binaries
      run: |
        cd build-crash
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        . "$TCL_CONFIG"
        make OPTIONS='-DSQLITE_TEST=1 -DSQLITE_CRASH_TEST=1' \
          OPTS="$TCL_INCLUDE_SPEC" \
          libdoltlite.a doltlite-crashtest crash_recovery_test_sqlite_test

    - name: Native crash recovery test (SQLITE_TEST)
      run: |
        cd build-crash
        ./crash_recovery_test_sqlite_test

    - name: Crash injection durability test (SQLITE_TEST)
      run: |
        cd build-crash
        bash ../test/crash_injection_test.sh ./doltlite-crashtest

    # ── 2) history-independence ──────────────────────────────────────
    - name: Configure history-independence build (build)
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build doltlite for history-independence
      run: |
        cd build
        make doltlite

    - name: History independence tests
      run: |
        cd build
        bash ../test/history_independence_test.sh ./doltlite

    # ── 3) fuzz-replaywal ────────────────────────────────────────────
    - name: Configure libFuzzer build (build-fuzz)
      run: |
        mkdir -p build-fuzz && cd build-fuzz
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build libdoltlite.a with libFuzzer + ASan
      run: |
        cd build-fuzz
        make CC=clang \
          CFLAGS="-O1 -g -fsanitize=fuzzer-no-link,address -fno-omit-frame-pointer -fno-sanitize-recover=address" \
          LDFLAGS="-fsanitize=fuzzer-no-link,address" \
          libdoltlite.a

    - name: Compile fuzz harnesses
      run: |
        for target in fuzz_replaywal fuzz_prolly_node fuzz_deserialize_refs fuzz_read_index fuzz_deserialize_catalog; do
          clang -O1 -g \
            -fsanitize=fuzzer,address -fno-omit-frame-pointer -fno-sanitize-recover=address \
            -DDOLTLITE_PROLLY=1 -D_HAVE_SQLITE_CONFIG_H \
            -I"$GITHUB_WORKSPACE/build-fuzz" -I"$GITHUB_WORKSPACE/src" \
            -o "$GITHUB_WORKSPACE/build-fuzz/$target" \
            "$GITHUB_WORKSPACE/test/$target.c" \
            "$GITHUB_WORKSPACE/build-fuzz/libdoltlite.a" \
            -lz -lpthread
        done

    - name: Run csReplayWal fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_replaywal" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/replaywal" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run prolly_node fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_prolly_node" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/prolly_node" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run csDeserializeRefs fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_deserialize_refs" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/deserialize_refs" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run csReadIndex fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_read_index" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/read_index" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Run deserializeCatalog fuzzer (1m)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_deserialize_catalog" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/deserialize_catalog" \
          -max_total_time=60 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Upload fuzz crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: |
          crash-*
          leak-*
          timeout-*
        if-no-files-found: ignore
