name: Smoke

on:
  push:
    branches: [master]
  pull_request:

jobs:
  crash-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install crash-test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev libtommath-dev build-essential zlib1g-dev

    - name: Configure SQLITE_TEST build
      run: |
        mkdir -p build-crash && cd build-crash
        TCL_CONFIG=$(find /usr/lib /usr/lib/x86_64-linux-gnu /usr/share -name tclConfig.sh 2>/dev/null | grep -v miniconda | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build crash-test binaries
      run: |
        cd build-crash
        TCL_CONFIG=$(find /usr/lib /usr/lib/x86_64-linux-gnu /usr/share -name tclConfig.sh 2>/dev/null | grep -v miniconda | head -1)
        . "$TCL_CONFIG"
        make OPTIONS='-DSQLITE_TEST=1 -DSQLITE_CRASH_TEST=1' \
          OPTS="$TCL_INCLUDE_SPEC" \
          libdoltlite.a doltlite-crashtest crash_recovery_test_sqlite_test

    - name: Native crash recovery test (SQLITE_TEST)
      run: |
        cd build-crash
        ./crash_recovery_test_sqlite_test
      timeout-minutes: 10

    - name: Crash injection durability test (SQLITE_TEST)
      run: |
        cd build-crash
        bash ../test/crash_injection_test.sh ./doltlite-crashtest
      timeout-minutes: 15

  history-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -name tclConfig.sh 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build
      run: |
        cd build
        make doltlite

    - name: History independence tests
      run: |
        cd build
        bash ../test/history_independence_test.sh ./doltlite

  fuzz-replaywal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev clang

    - name: Configure
      run: |
        mkdir -p build-fuzz && cd build-fuzz
        TCL_CONFIG=$(find /usr -name tclConfig.sh 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build libdoltlite.a with libFuzzer + ASan
      run: |
        cd build-fuzz
        make CC=clang \
          CFLAGS="-O1 -g -fsanitize=fuzzer-no-link,address -fno-omit-frame-pointer -fno-sanitize-recover=address" \
          LDFLAGS="-fsanitize=fuzzer-no-link,address" \
          libdoltlite.a

    - name: Compile harness
      run: |
        clang -O1 -g \
          -fsanitize=fuzzer,address -fno-omit-frame-pointer -fno-sanitize-recover=address \
          -DDOLTLITE_PROLLY=1 -D_HAVE_SQLITE_CONFIG_H \
          -I"$GITHUB_WORKSPACE/build-fuzz" -I"$GITHUB_WORKSPACE/src" \
          -o "$GITHUB_WORKSPACE/build-fuzz/fuzz_replaywal" \
          "$GITHUB_WORKSPACE/test/fuzz_replaywal.c" \
          "$GITHUB_WORKSPACE/build-fuzz/libdoltlite.a" \
          -lz -lpthread

    - name: Run fuzzer (30s smoke)
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1:detect_leaks=0
      run: |
        "$GITHUB_WORKSPACE/build-fuzz/fuzz_replaywal" \
          "$GITHUB_WORKSPACE/test/fuzz-corpus/replaywal" \
          -max_total_time=30 \
          -timeout=10 \
          -rss_limit_mb=2048 \
          -print_final_stats=1

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-replaywal-crashes
        path: |
          crash-*
          leak-*
          timeout-*
        if-no-files-found: ignore
