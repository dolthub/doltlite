name: Sanitizers

on:
  workflow_call:

jobs:
  asan-ubsan:
    name: asan-ubsan-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Buckets are grouped so no job runs much past six minutes.
          - suite: oracles
            bucket: remotes-recovery
          - suite: oracles-vc
            bucket: refs-workspace diff-history-data
          - suite: oracles-merge
            bucket: merge-replay-schema
          # Every DoltLite shell suite (sanitizer manifest set) plus the
          # correctness tests and the C corpus.
          - suite: native

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh tcl-dev build-essential zlib1g-dev

    - name: Install Dolt
      if: startsWith(matrix.suite, 'oracles')
      run: bash .github/scripts/install-dolt-oracle.sh

    - name: Download ASan/UBSan build
      uses: actions/download-artifact@v4
      with:
        name: asan-ubsan-ubuntu

    - name: Extract ASan/UBSan build
      run: tar -xzf asan-ubsan-ubuntu.tar.gz

    # ASan options: log to stderr, abort on error, leak detection
    # on. A suppressions file (build/lsan.supp) is created right
    # after to filter stock sqlite shell allocations that leak by
    # design on exit and aren't where we want leak coverage.
    # UBSan options: print full stack on first error.
    - name: Set sanitizer env
      run: |
        echo "ASAN_OPTIONS=abort_on_error=1:detect_leaks=1:halt_on_error=1:print_stacktrace=1" >> $GITHUB_ENV
        echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/.github/lsan.supp:print_suppressions=0" >> $GITHUB_ENV
        echo "UBSAN_OPTIONS=abort_on_error=1:halt_on_error=1:print_stacktrace=1" >> $GITHUB_ENV

    - name: SQL oracle tests (vs stock SQLite and Dolt)
      if: matrix.suite == 'oracles'
      run: |
        cd build
        bash ../test/assert_stock_reference.sh ./sqlite3 ./doltlite || exit 1
        bash ../test/sql_oracle_test.sh ./doltlite ./sqlite3 || exit 1
        bash ../test/oracle_import_test.sh ./doltlite dolt || exit 1
        for f in ../test/oracle_*_test.sh; do
          [ "$(basename "$f")" = "oracle_import_test.sh" ] && continue
          echo "--- $(basename "$f") ---"
          bash ../test/run_guarded_suite.sh "$f" ./doltlite ./sqlite3 || exit 1
        done
      timeout-minutes: 15

    # One job per bucket, matching oracle-tests. The manifest check is what
    # makes that safe to rely on: it proves every vc_oracle_*_test.sh is in
    # exactly one bucket, so nothing runs twice and nothing goes unrun.
    - name: Check oracle bucket manifests
      if: startsWith(matrix.suite, 'oracles')
      run: bash test/check_oracle_buckets.sh

    - name: Version control oracle tests (vs Dolt)
      if: matrix.bucket
      run: |
        cd build
        for bucket in ${{ matrix.bucket }}; do
          while IFS= read -r oracle; do
            [ -z "$oracle" ] && continue
            echo "--- $oracle ---"
            bash "../test/$oracle" ./doltlite dolt || exit 1
          done < "../test/oracle-buckets/$bucket.txt"
        done
      timeout-minutes: 25

    - name: Correctness regression tests
      if: matrix.suite == 'native'
      run: cd build && bash ../test/correctness_test.sh ./doltlite

    # Every DoltLite shell suite the coverage job runs, under ASan/UBSan,
    # minus the ones that need artifacts this tarball lacks. The set is the
    # manifest's sanitizer set, so a new suite is covered here by default.
    # If it outgrows the budget, split with DOLTLITE_SUITE_SHARD=k/n.
    - name: DoltLite shell suites (ASan/UBSan)
      if: matrix.suite == 'native'
      run: |
        DOLTLITE_BUILD_DIR="$PWD/build" DOLTLITE_SUITE_SET=sanitizer \
          bash test/run_doltlite_tests.sh
      timeout-minutes: 20

    # The C regression corpus (~310k checks) under ASan/UBSan with leak
    # detection — where the #1325/#1328 use-after-frees and leaks lived.
    - name: C regression corpus (ASan/UBSan)
      if: matrix.suite == 'native'
      run: cd build && ./doltlite_regression_test_c all

  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TSAN_CFLAGS: -O1 -g -fsanitize=thread -fno-omit-frame-pointer
      TSAN_LDFLAGS: -fsanitize=thread
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh zlib1g-dev

    - name: Download TSan build
      uses: actions/download-artifact@v4
      with:
        name: tsan-build

    - name: Extract TSan build
      run: tar -xzf tsan-build.tar.gz

    - name: Run threadtest4 serialized
      run: |
        cd build
        rm -f tt4-test1.db tt4-test2.db tt4-test3.db
        ./threadtest4 --serialized 6

    - name: Run threadtest4 multithread
      run: |
        cd build
        rm -f tt4-test1.db tt4-test2.db tt4-test3.db
        ./threadtest4 --multithread 6

    - name: Run threadtest5 shared-database workers
      env:
        # ThreadSanitizer slows execution ~10x, so the test's default 2s busy
        # timeout is easily exceeded under 8-worker write contention, spuriously
        # failing the p1/p2 consistency check. Give writers room to make progress.
        THREADTEST5_BUSY_MS: "60000"
      run: |
        cd build
        rm -f /tmp/doltlite-threadtest5.db
        ./threadtest5 'file:/tmp/doltlite-threadtest5.db?mode=rwc' -num-workers 8

    - name: Run version-control concurrency under TSan
      env:
        # Same reason threadtest5 above gets a longer busy window: three forked
        # workers contending on ref updates make far less progress per second
        # under TSan, and the stress test's default retry budget is a wall
        # clock, so it has to be told to wait proportionally longer.
        DOLTLITE_STRESS_BUSY_MS: "120000"
      run: |
        cd build
        ./vc_concurrency_test
        ./vc_ref_mutation_stress_test

    - name: Run HTTP remote concurrency under TSan
      run: |
        cd build
        bash ../test/remotesrv_http_concurrency_test.sh \
          ./doltlite ./doltlite-remotesrv
      timeout-minutes: 10
