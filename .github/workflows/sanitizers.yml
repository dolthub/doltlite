name: Sanitizers

on:
  workflow_call:

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh tcl-dev build-essential zlib1g-dev

    - name: Install Dolt
      run: |
        curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz \
          | sudo tar -xz -C /usr/local --strip-components=1
        dolt version

    - name: Download ASan/UBSan build
      uses: actions/download-artifact@v4
      with:
        name: asan-ubsan-ubuntu

    - name: Extract ASan/UBSan build
      run: tar -xzf asan-ubsan-ubuntu.tar.gz

    # ASan options: log to stderr, abort on error, leak detection
    # on. A suppressions file (build/lsan.supp) is created right
    # after to filter stock sqlite shell allocations that leak by
    # design on exit and aren't where we want leak coverage.
    # UBSan options: print full stack on first error.
    - name: Set sanitizer env
      run: |
        echo "ASAN_OPTIONS=abort_on_error=1:detect_leaks=1:halt_on_error=1:print_stacktrace=1" >> $GITHUB_ENV
        echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/.github/lsan.supp:print_suppressions=0" >> $GITHUB_ENV
        echo "UBSAN_OPTIONS=abort_on_error=1:halt_on_error=1:print_stacktrace=1" >> $GITHUB_ENV

    # Keep this in lockstep with the normal oracle-tests job. Globbing the
    # suites makes every new oracle sanitizer-covered automatically instead
    # of relying on a hand-maintained subset that can silently drift.
    - name: SQL oracle tests (vs stock SQLite and Dolt)
      run: |
        cd build
        bash ../test/sql_oracle_test.sh ./doltlite ./sqlite3 || exit 1
        bash ../test/oracle_import_test.sh ./doltlite dolt || exit 1
        for f in ../test/oracle_*_test.sh; do
          [ "$(basename "$f")" = "oracle_import_test.sh" ] && continue
          echo "--- $(basename "$f") ---"
          bash "$f" ./doltlite ./sqlite3 || exit 1
        done
      timeout-minutes: 15

    - name: Version control oracle tests (vs Dolt)
      run: |
        cd build
        for f in ../test/vc_oracle_*_test.sh; do
          echo "--- $(basename "$f") ---"
          bash "$f" ./doltlite dolt || exit 1
        done
      timeout-minutes: 25

    - name: Correctness regression tests
      run: cd build && bash ../test/correctness_test.sh ./doltlite

    # Version-control virtual tables decode stored values and rebuild rows
    # through the prolly record codec — exactly where signed-int / value
    # decode UB lives (the left-shift-of-negative this PR fixes surfaced
    # here). The oracle suites above are stock-SQL semantics and the C
    # corpus is C-API level; neither exercises these SQL vtab read paths.
    - name: VC virtual-table read suites
      run: |
        cd build
        for s in doltlite_at doltlite_history doltlite_diff doltlite_diff_table \
                 doltlite_diff_table_range \
                 doltlite_schema_diff doltlite_workspace doltlite_conflicts \
                 doltlite_conflict_rows doltlite_comparison doltlite_merge; do
          echo "=== $s ==="
          bash ../test/$s.sh ./doltlite || exit 1
        done

    # Ref-mutation, GC, and remote clone/pull paths deserialize the refs blob
    # and rewrite refs/chunks — memory-management code (the refs int-overflow
    # and the cursor-pin / merge-cleanup fixes lived here) that the oracle and
    # read-vtab suites above never exercise under ASan. Kept to fast,
    # self-contained suites (no server, no external Dolt) to stay in budget.
    - name: VC ref-mutation + remote suites
      run: |
        cd build
        for s in doltlite_branch doltlite_default_branch doltlite_tag \
                 doltlite_gc remote_test; do
          echo "=== $s ==="
          bash ../test/$s.sh ./doltlite || exit 1
        done

    # The C regression corpus (~310k checks) under ASan/UBSan with leak
    # detection — where the #1325/#1328 use-after-frees and leaks lived.
    - name: C regression corpus (ASan/UBSan)
      run: cd build && ./doltlite_regression_test_c all

  # Same ASan/UBSan coverage as the Linux job above, but on macOS/arm64 to
  # catch platform-specific undefined behavior and memory bugs the Linux x86
  # job can't. Apple's ASan has no leak detector, so detect_leaks/LSan is
  # dropped here; the Linux job retains leak coverage. Dolt-dependent oracles
  # are omitted (no macOS Dolt install) — the stock-SQLite oracles, native VC
  # suites, and the C corpus exercise the same C paths under the sanitizers.
  asan-ubsan-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      ASAN_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
      ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1
      UBSAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1

    steps:
    - uses: actions/checkout@v4

    - name: Download ASan/UBSan build
      uses: actions/download-artifact@v4
      with:
        name: asan-ubsan-macos

    - name: Extract ASan/UBSan build
      run: tar -xzf asan-ubsan-macos.tar.gz

    - name: SQL oracle tests (vs stock SQLite)
      run: |
        cd build
        bash ../test/sql_oracle_test.sh ./doltlite ./sqlite3 || exit 1
        for f in ../test/oracle_*_test.sh; do
          [ "$(basename "$f")" = "oracle_import_test.sh" ] && continue
          echo "--- $(basename "$f") ---"
          bash "$f" ./doltlite ./sqlite3 || exit 1
        done
      timeout-minutes: 20

    - name: Correctness regression tests
      run: cd build && bash ../test/correctness_test.sh ./doltlite

    - name: VC virtual-table read suites
      run: |
        cd build
        for s in doltlite_at doltlite_history doltlite_diff doltlite_diff_table \
                 doltlite_diff_table_range \
                 doltlite_schema_diff doltlite_workspace doltlite_conflicts \
                 doltlite_conflict_rows doltlite_comparison doltlite_merge; do
          echo "=== $s ==="
          bash ../test/$s.sh ./doltlite || exit 1
        done

    - name: VC ref-mutation + remote suites
      run: |
        cd build
        for s in doltlite_branch doltlite_default_branch doltlite_tag \
                 doltlite_gc remote_test; do
          echo "=== $s ==="
          bash ../test/$s.sh ./doltlite || exit 1
        done

    - name: C regression corpus (ASan/UBSan)
      run: cd build && ./doltlite_regression_test_c all

  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TSAN_CFLAGS: -O1 -g -fsanitize=thread -fno-omit-frame-pointer
      TSAN_LDFLAGS: -fsanitize=thread
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh zlib1g-dev

    - name: Download TSan build
      uses: actions/download-artifact@v4
      with:
        name: tsan-build

    - name: Extract TSan build
      run: tar -xzf tsan-build.tar.gz

    - name: Run threadtest4 serialized
      run: |
        cd build
        rm -f tt4-test1.db tt4-test2.db tt4-test3.db
        ./threadtest4 --serialized 6

    - name: Run threadtest4 multithread
      run: |
        cd build
        rm -f tt4-test1.db tt4-test2.db tt4-test3.db
        ./threadtest4 --multithread 6

    - name: Run threadtest5 shared-database workers
      env:
        # ThreadSanitizer slows execution ~10x, so the test's default 2s busy
        # timeout is easily exceeded under 8-worker write contention, spuriously
        # failing the p1/p2 consistency check. Give writers room to make progress.
        THREADTEST5_BUSY_MS: "60000"
      run: |
        cd build
        rm -f /tmp/doltlite-threadtest5.db
        ./threadtest5 'file:/tmp/doltlite-threadtest5.db?mode=rwc' -num-workers 8

    - name: Run HTTP remote concurrency under TSan
      run: |
        cd build
        bash ../test/remotesrv_http_concurrency_test.sh \
          ./doltlite ./doltlite-remotesrv
      timeout-minutes: 10
