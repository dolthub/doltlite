name: Nightly embedding issues

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview changes without filing or commenting on issues
        type: boolean
        default: true
      since:
        description: Optional ISO 8601 start time for a backfill
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: nightly-embedding-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Read DoltHub membership
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.DOLTHUB_MEMBERS_TOKEN || secrets.RELEASE_BOT_TOKEN }}
      run: |
        umask 077
        roster="$RUNNER_TEMP/embedding-issue-members.json"
        public="$RUNNER_TEMP/embedding-issue-public-members.json"
        gh api --paginate --slurp 'orgs/dolthub/members?per_page=100' | jq '[.[][] | .id]' > "$roster"
        gh api --paginate --slurp 'orgs/dolthub/public_members?per_page=100' | jq '[.[][] | .id]' > "$public"
        if ! jq -es '.[0] - .[1] | length > 0' "$roster" "$public" > /dev/null; then
          echo "::error::The DoltHub membership token must be able to read concealed memberships."
          exit 1
        fi
    - name: Sync issue activity into DoltLite
      env:
        GH_TOKEN: ${{ github.token }}
        EMBEDDING_ISSUES_MEMBER_IDS: ${{ runner.temp }}/embedding-issue-members.json
        EMBEDDING_ISSUES_APPLY: ${{ github.event_name == 'schedule' || !inputs.dry-run }}
        EMBEDDING_ISSUES_SINCE: ${{ inputs.since }}
      run: node .github/scripts/sync-embedding-issues.js

  watchdog:
    needs: [sync]
    if: github.event_name == 'schedule' && (failure() || cancelled())
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - name: Describe the sync failure
      run: |
        printf '%s\n' \
          'The scheduled embedding issue sync failed. See the sync job result and logs.' \
          'The next successful run resumes from the last successful scheduled run.' \
          > "$RUNNER_TEMP/embedding-issues-failure.md"
    - name: Report the sync failure
      uses: ./.github/actions/report-failure-issue
      with:
        label: nightly-embedding-issues-failure
        title: Nightly embedding issue sync failed
        body-file: ${{ runner.temp }}/embedding-issues-failure.md
        token: ${{ github.token }}
