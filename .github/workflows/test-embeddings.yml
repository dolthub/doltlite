name: Test embeddings

on:
  workflow_call:
    inputs:
      nuget:
        type: boolean
        required: true

jobs:
  linux:
    name: Linux (Node, Wasm and NuGet)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EMSDK_VERSION: 3.1.74
      EMCC_CFLAGS: -Wno-limited-postlink-optimizations
      WABT_VERSION: 1.0.36

    steps:
    - uses: actions/checkout@v4

    - name: Cache Emscripten SDK
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/emsdk
        key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

    - name: Install Emscripten SDK
      run: |
        EMSDK_DIR="${RUNNER_TOOL_CACHE}/emsdk"
        if [ ! -d "$EMSDK_DIR/.git" ]; then
          rm -rf "$EMSDK_DIR"
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
        fi
        cd "$EMSDK_DIR"
        git fetch --tags --quiet
        ./emsdk install "$EMSDK_VERSION"
        ./emsdk activate "$EMSDK_VERSION"
        echo "EMSDK=$EMSDK_DIR" >> "$GITHUB_ENV"

    - name: Cache WABT
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/wabt-${{ env.WABT_VERSION }}
        key: wabt-${{ runner.os }}-${{ env.WABT_VERSION }}

    - name: Install WABT
      run: |
        WABT_DIR="${RUNNER_TOOL_CACHE}/wabt-${WABT_VERSION}"
        if [ ! -x "$WABT_DIR/bin/wasm-strip" ]; then
          rm -rf "$WABT_DIR"
          mkdir -p "$WABT_DIR"
          curl -fsSL "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-ubuntu-20.04.tar.gz" \
            | tar -xz --strip-components=1 -C "$WABT_DIR"
        fi
        echo "$WABT_DIR/bin" >> "$GITHUB_PATH"

    - name: Build
      env:
        TEST_NUGET: ${{ inputs.nuget }}
      run: |
        source "$EMSDK/emsdk_env.sh"
        set -o pipefail
        {
          ./configure
          make sqlite3.c sqlite3.h sqlite3ext.h
          bash test/amalgamation_wasm_compile_test.sh sqlite3.c
          mkdir -p build
          cd build
          ../configure
          targets=(doltlite doltlite-remotesrv)
          if [[ "$TEST_NUGET" = true ]]; then
            targets+=(doltlite-lib)
          fi
          make -j"$(nproc)" "${targets[@]}"
          cd ..
          make -C ext/wasm fiddle npm
          bash test/wasm_incremental_build_test.sh
          mkdir -p ci-wasm-runtime
          cp -a ext/wasm/jswasm/. ci-wasm-runtime/
          make -C ext/wasm dist
          rm -rf ext/wasm/jswasm
          mv ci-wasm-runtime ext/wasm/jswasm
        } 2>&1 | tee wasm-build.log
        if grep -E "warning:" wasm-build.log; then
          echo "::error::compiler warnings in wasm build"
          exit 1
        fi

    - name: Check out the Node binding
      uses: actions/checkout@v4
      with:
        repository: dolthub/doltlite-node
        ref: 5917efb805215dd49ff6798f78383be02e75a548
        path: build/node-binding
        persist-credentials: false

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Run Node binding regressions against this build
      run: bash packaging/node/test-build.sh build/node-binding .

    - name: Smoke test DoltLite wasm runtime
      run: |
        node ext/wasm/test-doltlite-smoke.mjs

    - name: End-to-end test DoltLite wasm writes
      run: |
        node ext/wasm/test-doltlite-write-e2e.mjs

    - name: Test DoltLite wasm handle disposal
      run: node ext/wasm/test-doltlite-disposal.mjs

    - name: Roundtrip exported wasm DB into native DoltLite
      run: |
        node ext/wasm/test-doltlite-export-roundtrip.mjs

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-1.65.0

    - name: Install Playwright and Chromium
      run: |
        npm install --prefix build/wasm-browser --no-save playwright@1.65.0
        node build/wasm-browser/node_modules/playwright/cli.js install chromium

    - name: Test OPFS SAH pool imports in Chromium
      run: node ext/wasm/test-doltlite-opfs-import.mjs

    - name: Test DoltLite wasm file:// remotes
      run: |
        node ext/wasm/test-doltlite-remote.mjs

    - name: Test DoltLite wasm http:// remotes
      run: |
        node ext/wasm/test-doltlite-http-remote.mjs

    - name: Smoke test the @dolthub/doltlite-wasm npm package
      run: bash packaging/npm/test-package.sh --browser

    - uses: actions/setup-dotnet@v4
      if: inputs.nuget
      with:
        dotnet-version: '8.0.x'

    - name: Smoke test the Linux NuGet package
      if: inputs.nuget
      run: bash packaging/nuget/test-package.sh build
      timeout-minutes: 10

    - name: Upload wasm artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-build
        path: |
          ext/wasm/jswasm/*
          ext/wasm/sqlite-wasm-*.zip
