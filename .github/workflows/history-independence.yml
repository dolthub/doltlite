name: History Independence

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  history-independence-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -name tclConfig.sh 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build
      run: |
        cd build
        make doltlite

    - name: History independence tests
      run: |
        cd build
        bash ../test/history_independence_test.sh ./doltlite
