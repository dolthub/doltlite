name: CI Build

on:
  workflow_call:

jobs:
  checked:
    name: checked-${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    env:
      CFLAGS: -O2 -g -Werror
    strategy:
      fail-fast: true
      matrix:
        include:
        - platform: ubuntu
          runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/checked-build
      with:
        platform: ${{ matrix.platform }}
    - name: Install layout
      if: matrix.platform != 'windows'
      run: bash test/install_layout_test.sh build
      timeout-minutes: 10
    - uses: ./.github/actions/checked-probes
      with:
        platform: ${{ matrix.platform }}

  sqllogictest-build:
    name: sqllogictest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential fossil tcl-dev unixodbc-dev zlib1g-dev

    - name: Generate DoltLite amalgamation
      run: |
        mkdir -p build
        cd build
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi
        make DOLTLITE_PROLLY=1 DOLTLITE_PROLLY_CHECK=1 sqlite3.c sqlite3.h

    - name: Restore SQLLogicTest reference
      uses: ./.github/actions/sqllogictest-cache

    - name: Build sqllogictest runners
      run: |
        cp -R .sqllogictest-cache/tree build/sqllogictest
        cd build/sqllogictest/src
        cp ../../sqlite3.c sqlite3.c
        cp ../../sqlite3.h sqlite3.h
        gcc -Werror -Wno-comment -g -O2 \
          -DSQLITE_NO_SYNC=1 -DSQLITE_THREADSAFE=1 \
          -DSQLITE_OMIT_LOAD_EXTENSION -c sqlite3.c \
          -o sqlite3-doltlite.o
        gcc -Werror -g -O2 -o sqllogictest-doltlite \
          sqllogictest.c md5.o sqlite3-doltlite.o \
          -lpthread -lm -lz -lodbc

    - name: Package
      run: bash .github/scripts/package-ci-build.sh sqllogictest-build.tar.gz build/sqllogictest

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: sqllogictest-build
        path: sqllogictest-build.tar.gz
        compression-level: 0
        retention-days: 1

  coverage-build:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: clang
      CFLAGS: -O1 -g -Werror -Wno-comment -fprofile-instr-generate -fcoverage-mapping
      LDFLAGS: -fprofile-instr-generate

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential clang llvm tcl-dev zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build-coverage
        cd build-coverage
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build
      run: |
        cd build-coverage
        set -o pipefail
        {
          make -j2 DOLTLITE_PROLLY_CHECK=1 \
            doltlite doltlite-remotesrv doltlite-lib testfixture vec1.so vec1testscalar.so \
            doltlite-c-tests-build doltlite-regression-test-c-build
          blake_objects=(blake3.o blake3_portable.o blake3_dispatch.o)
          for object in blake3_sse2.o blake3_sse41.o blake3_avx2.o blake3_avx512.o blake3_neon.o; do
            [ ! -f "$object" ] || blake_objects+=("$object")
          done
          clang $CFLAGS ../test/blake3_kat.c \
            prolly_hash.o "${blake_objects[@]}" \
            -I../src -I../ext/blake3 -DDOLTLITE_PROLLY=1 \
            $LDFLAGS -lm -o blake3_kat_test
        } 2>&1 | tee build.log
        if grep -E "warning:" build.log; then
          echo "::error::compiler warnings in coverage build"
          exit 1
        fi
        find . -type f -name '*.profraw' -delete

    - name: Build the stock reference
      run: bash test/build_stock_reference.sh --shell-only build-stockref build-coverage/doltlite

    - name: Package
      run: |
        mkdir -p coverage-artifact/build-coverage
        cp build-coverage/doltlite \
          build-coverage/doltlite-remotesrv \
          build-coverage/doltlite_regression_test_c \
          build-coverage/testfixture \
          build-coverage/vec1.so \
          build-coverage/vec1testscalar.so \
          build-coverage/libdoltlite.a \
          build-coverage/sqlite3.h \
          build-coverage/prolly_hash.o \
          build-coverage/blake3*.o \
          build-coverage/*_test \
          coverage-artifact/build-coverage/
        cp build-stockref/sqlite3 \
          coverage-artifact/build-coverage/sqlite3-stock
        strip_artifacts=()
        for artifact in coverage-artifact/build-coverage/*; do
          [ "$(basename "$artifact")" = sqlite3.h ] || strip_artifacts+=("$artifact")
        done
        llvm-strip --strip-debug "${strip_artifacts[@]}"
        # The consumers compare against this copy, so assert the copy: it is
        # what ships, and stripping it is the last thing that touches it.
        bash test/assert_stock_reference.sh \
          coverage-artifact/build-coverage/sqlite3-stock \
          coverage-artifact/build-coverage/doltlite
        bash .github/scripts/package-coverage-build.sh coverage-artifact

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: coverage-build
        path: coverage-build.tar.gz
        compression-level: 0
        retention-days: 1

    - name: Upload oracle runtime
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cli
        path: coverage-cli.tar.gz
        compression-level: 0
        retention-days: 1

    - name: Upload regression runtime
      uses: actions/upload-artifact@v4
      with:
        name: coverage-fixture
        path: coverage-fixture.tar.gz
        compression-level: 0
        retention-days: 1

  benchmark-build:
    name: optimized-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Check out candidate
      uses: actions/checkout@v4

    - name: Check out PR base
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
        path: benchmark-base

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential tcl-dev zlib1g-dev

    - name: Identify base build cache
      id: base-key
      run: |
        key=$(bash .github/scripts/benchmark-cache-key.sh benchmark-base)
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore base build
      id: base-cache
      uses: actions/cache@v4
      with:
        path: benchmark-baseline
        key: benchmark-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.base-key.outputs.key }}

    - name: Build candidate
      run: bash .github/scripts/build-optimized-benchmark.sh .

    - name: Build base
      if: steps.base-cache.outputs.cache-hit != 'true'
      run: |
        rm -rf benchmark-baseline
        bash .github/scripts/build-optimized-benchmark.sh benchmark-base
        mkdir benchmark-baseline
        cp benchmark-base/build/doltlite benchmark-base/build/bench_timer_doltlite \
          benchmark-base/build/build.log benchmark-baseline/

    - name: Validate base build
      run: |
        test -x benchmark-baseline/doltlite
        test -x benchmark-baseline/bench_timer_doltlite
        test -s benchmark-baseline/build.log
        if grep -E "warning:" benchmark-baseline/build.log; then
          echo "::error::compiler warnings in optimized base build"
          exit 1
        fi

    - name: Package
      run: |
        git rev-parse HEAD > benchmark-candidate-sha
        git -C benchmark-base rev-parse HEAD > benchmark-baseline-sha
        bash .github/scripts/package-ci-build.sh benchmark-build.tar.gz \
          build/doltlite build/bench_timer_doltlite \
          benchmark-baseline/doltlite benchmark-baseline/bench_timer_doltlite \
          benchmark-candidate-sha benchmark-baseline-sha

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-build
        path: benchmark-build.tar.gz
        compression-level: 0
        retention-days: 1

    - name: Upload build metadata
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-build-metadata
        path: |
          benchmark-candidate-sha
          benchmark-baseline-sha
        retention-days: 1

  asan-ubsan-build:
    name: asan-ubsan-${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
        - platform: ubuntu
          runs-on: ubuntu-latest
          warning-flags: ''
    env:
      ASAN_CFLAGS: -O1 -g -Werror ${{ matrix.warning-flags }} -fsanitize=address,undefined -fno-omit-frame-pointer
        -fno-sanitize-recover=all
      ASAN_LDFLAGS: -fsanitize=address,undefined
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/asan-build
      with:
        platform: ${{ matrix.platform }}

  tsan-build:
    name: tsan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TSAN_CFLAGS: -O1 -g -Werror -Wno-comment -fsanitize=thread -fno-omit-frame-pointer
      TSAN_LDFLAGS: -fsanitize=thread

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential clang zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build
        cd build
        CC=clang ../configure

    - name: Build
      run: |
        set -eo pipefail
        cd build
        {
          make CC=clang CFLAGS="$TSAN_CFLAGS" LDFLAGS="$TSAN_LDFLAGS" \
            sqlite3.c sqlite3.h
          clang $TSAN_CFLAGS -I. -I../src \
            -c sqlite3.c -o ci-amalgamation.o
          clang $TSAN_CFLAGS -DDOLTLITE_PROLLY=1 -I. -I../src \
            -o threadtest4 ../test/threadtest4.c ci-amalgamation.o \
            $TSAN_LDFLAGS -ldl -lpthread -lm -lz
          clang $TSAN_CFLAGS -I. -I../src \
            -o threadtest5 ../test/threadtest5.c ci-amalgamation.o \
            $TSAN_LDFLAGS -ldl -lpthread -lm -lz
          clang $TSAN_CFLAGS -I. -I../src \
            -o tsan_randomness_pid ../test/tsan_randomness_pid.c \
            ci-amalgamation.o $TSAN_LDFLAGS -ldl -lpthread -lm -lz
          rm -f ci-amalgamation.o
          make -j2 CC=clang CFLAGS="$TSAN_CFLAGS" LDFLAGS="$TSAN_LDFLAGS" \
            doltlite doltlite-remotesrv vc_concurrency_test \
            vc_ref_mutation_stress_test
        } 2>&1 | tee build.log
        if grep -E "warning:" build.log; then
          echo "::error::compiler warnings in TSan build"
          exit 1
        fi

    - name: Package
      run: bash .github/scripts/package-ci-build.sh tsan-build.tar.gz build

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: tsan-build
        path: tsan-build.tar.gz
        compression-level: 0
        retention-days: 1

  crash-build:
    name: crash
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential libtommath-dev tcl-dev zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build-crash
        cd build-crash
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build
      run: |
        cd build-crash
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        . "$TCL_CONFIG"
        set -eo pipefail
        make -j2 OPTIONS='-DSQLITE_TEST=1 -DSQLITE_CRASH_TEST=1' \
          OPTS="$TCL_INCLUDE_SPEC" \
          libdoltlite.a doltlite-crashtest crash_recovery_test_sqlite_test \
          2>&1 | tee build.log
        if grep -E "warning:" build.log; then
          echo "::error::compiler warnings in crash-test build"
          exit 1
        fi

    - name: Package
      run: bash .github/scripts/package-ci-build.sh crash-build.tar.gz build-crash

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: crash-build
        path: crash-build.tar.gz
        compression-level: 0
        retention-days: 1

  fuzz-build:
    name: libfuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUZZ_CFLAGS: -O1 -g -Werror -fsanitize=fuzzer-no-link,address -fno-omit-frame-pointer -fno-sanitize-recover=address
      FUZZ_LDFLAGS: -fsanitize=fuzzer-no-link,address

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential clang tcl-dev zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build-fuzz
        cd build-fuzz
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build
      run: |
        cd build-fuzz
        set -eo pipefail
        {
          make -j2 CC=clang CFLAGS="$FUZZ_CFLAGS" LDFLAGS="$FUZZ_LDFLAGS" \
            libdoltlite.a
          for target in fuzz_replaywal fuzz_prolly_node fuzz_deserialize_refs fuzz_read_index fuzz_deserialize_catalog fuzz_wire_response fuzz_commit fuzz_working_set fuzz_conflicts fuzz_constraint_violations fuzz_database; do
            clang -O1 -g -Werror \
              -fsanitize=fuzzer,address -fno-omit-frame-pointer \
              -fno-sanitize-recover=address \
              -DDOLTLITE_PROLLY=1 -D_HAVE_SQLITE_CONFIG_H \
              -I. -I../src \
              -o "$target" "../test/$target.c" libdoltlite.a \
              -lz -lpthread
          done
        } 2>&1 | tee build.log
        if grep -E "warning:" build.log; then
          echo "::error::compiler warnings in libFuzzer build"
          exit 1
        fi

    - name: Package
      run: bash .github/scripts/package-ci-build.sh fuzz-build.tar.gz build-fuzz

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-build
        path: fuzz-build.tar.gz
        compression-level: 0
        retention-days: 1

  compat-build:
    name: compatibility-references
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential tcl-dev zlib1g-dev

    - uses: ./.github/actions/compatibility-cache

    - name: Package
      run: bash .github/scripts/package-ci-build.sh compat-build.tar.gz .compat-cache

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: compat-build
        path: compat-build.tar.gz
        compression-level: 0
        retention-days: 1

  assert-build:
    name: assert-enabled
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential tcl-dev zlib1g-dev

    - name: Build dirty-check probe
      env:
        CFLAGS: -g -O0 -Werror
      run: |
        mkdir -p build-assert
        cd build-assert
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-debug --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure --with-debug
        fi
        if grep -E 'T\.cc \+= .* -DNDEBUG' Makefile; then
          echo "::error::assert-enabled configure still sets -DNDEBUG"
          exit 1
        fi
        if ! grep -E 'T\.cc \+= .* -DSQLITE_DEBUG=1' Makefile; then
          echo "::error::assert-enabled configure did not set -DSQLITE_DEBUG=1"
          exit 1
        fi
        make -j"$(nproc)" DOLTLITE_PROLLY=1 \
          catalog_serialize_determinism_test \
          doltlite-regression-test-c-build

    - name: Package
      run: |
        sha256sum \
          build-assert/catalog_serialize_determinism_test \
          build-assert/doltlite_regression_test_c \
          > build-assert/development-build.sha256
        echo "$GITHUB_SHA" > build-assert/development-build.commit
        bash .github/scripts/package-ci-build.sh development-build.tar.gz \
          build-assert/catalog_serialize_determinism_test \
          build-assert/doltlite_regression_test_c \
          build-assert/development-build.sha256 \
          build-assert/development-build.commit

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: development-build
        path: development-build.tar.gz
        compression-level: 0
        retention-days: 1
