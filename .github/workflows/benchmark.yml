name: Benchmark

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  int-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BENCH_RUNS: 21

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Build doltlite and stock SQLite
      run: |
        cd build
        make doltlite
        make doltlite-lib
        cc -O2 -I. -I../src -o bench_timer_doltlite ../test/sysbench_timer.c libdoltlite.a -lpthread -lz -lm
        make DOLTLITE_PROLLY=0 sqlite3 sqlite3.o
        cc -O2 -I. -I../src -o bench_timer_sqlite ../test/sysbench_timer.c sqlite3.o -lpthread -lz -lm

    - name: Run benchmark
      id: bench
      run: |
        cd build
        # Capture script exit code separately from the output capture.
        # Piping to `tee` would mask a ceiling-check failure (tee always
        # exits 0), letting the job report green on a regression. Stash
        # the rc and propagate it after the PR-comment step has run, so
        # results are still visible on a failing run.
        set +e
        BENCH_SECTION_MODE=full bash ../test/sysbench_compare.sh > /tmp/bench_results.md
        bench_rc=$?
        set -e
        cat /tmp/bench_results.md
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Comment PR with results
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          // Read from file so the multi-line markdown (and any backticks /
          // template-literal-unsafe chars in it) never has to round-trip
          // through YAML scalars or JS template-literal parsing.
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/bench_results.md', 'utf8');

          if (!context.issue.number) {
            console.log('No PR context (push event) — skipping comment');
            return;
          }

          // Find existing classic benchmark comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.data.find(c =>
            c.body.includes('<!-- benchmark:classic -->') ||
            c.body.includes('## Sysbench-Style Benchmark: Doltlite vs SQLite')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }

    - name: Enforce ceiling
      run: |
        rc="${{ steps.bench.outputs.bench_rc }}"
        if [ "$rc" != "0" ]; then
          echo "Benchmark exceeded performance ceiling (rc=$rc)" >&2
          exit "$rc"
        fi

  # Runs three non-INTKEY sysbench variants (TEXT PK, BLOB PK, composite
  # PK). Each is gated on both individual ratios and section average
  # ratios. Individual ceiling is 1.8x after recent write-path perf work
  # brought the slowest variants comfortably below the previous gates.
  # BENCH_RUNS=13 (vs int-keys' 21) because each non-INTKEY write is a
  # per-statement flush and runs slower per iteration.
  text-blob-comp-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      BENCH_RUNS: 13
      BENCH_MAX_MULTIPLIER: 1.8
      BENCH_AVG_MAX_MULTIPLIER: 1.5

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Build doltlite and stock SQLite
      run: |
        cd build
        make doltlite
        make doltlite-lib
        cc -O2 -I. -I../src -o bench_timer_doltlite ../test/sysbench_timer.c libdoltlite.a -lpthread -lz -lm
        make DOLTLITE_PROLLY=0 sqlite3 sqlite3.o
        cc -O2 -I. -I../src -o bench_timer_sqlite ../test/sysbench_timer.c sqlite3.o -lpthread -lz -lm

    - name: Run benchmarks
      id: bench
      run: |
        cd build
        # Each script enforces the configured individual and average
        # ceilings; capture rc per script and merge so a single ceiling
        # break fails the job after the PR-comment step has run.
        set +e
        bash ../test/sysbench_compare_textpk.sh      > /tmp/bench_textpk.md
        textpk_rc=$?
        bash ../test/sysbench_compare_blobpk.sh      > /tmp/bench_blobpk.md
        blobpk_rc=$?
        bash ../test/sysbench_compare_compositepk.sh > /tmp/bench_compositepk.md
        compositepk_rc=$?
        set -e
        cat /tmp/bench_textpk.md /tmp/bench_blobpk.md \
            /tmp/bench_compositepk.md \
            > /tmp/bench_extra_results.md
        cat /tmp/bench_extra_results.md
        bench_rc=0
        for rc in "$textpk_rc" "$blobpk_rc" "$compositepk_rc"; do
          if [ "$rc" != "0" ]; then bench_rc=$rc; fi
        done
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Comment PR with results
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          // Read from file so the multi-line markdown (and any backticks /
          // template-literal-unsafe chars in it) never has to round-trip
          // through YAML scalars or JS template-literal parsing.
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/bench_extra_results.md', 'utf8');

          if (!context.issue.number) {
            console.log('No PR context (push event) — skipping comment');
            return;
          }

          // Find existing benchmark-extra comment. Markers used to be
          // textpk-only; now we look for any of the non-INTKEY markers.
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.data.find(c =>
            c.body.includes('<!-- benchmark:textpk -->') ||
            c.body.includes('<!-- benchmark:blobpk -->') ||
            c.body.includes('<!-- benchmark:compositepk -->') ||
            c.body.includes('## Sysbench-Style Benchmark (TEXT PK): Doltlite vs SQLite')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }

    - name: Enforce ceiling
      run: |
        rc="${{ steps.bench.outputs.bench_rc }}"
        if [ "$rc" != "0" ]; then
          echo "Benchmark exceeded performance ceiling (rc=$rc)" >&2
          exit "$rc"
        fi
