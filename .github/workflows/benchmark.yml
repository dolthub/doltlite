name: Benchmark

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -name tclConfig.sh 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Build doltlite and stock SQLite
      run: |
        cd build
        make doltlite
        make DOLTLITE_PROLLY=0 sqlite3

    - name: Run benchmark
      id: bench
      run: |
        cd build
        set +e
        bash ../test/sysbench_compare.sh > /tmp/bench_results.md 2> /tmp/bench_stderr.txt
        status=$?
        set -e
        cat /tmp/bench_results.md
        if [ -s /tmp/bench_stderr.txt ]; then
          echo ""
          echo "--- benchmark stderr ---"
          cat /tmp/bench_stderr.txt
        fi
        if [ "$status" -ne 0 ]; then
          {
            echo ""
            echo "> Benchmark step failed with exit code $status"
            echo ""
            echo '```text'
            cat /tmp/bench_stderr.txt
            echo '```'
          } >> /tmp/bench_results.md
        fi
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"

    - name: Comment PR with results
      if: always()
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          // Read from file so the multi-line markdown (and any backticks /
          // template-literal-unsafe chars in it) never has to round-trip
          // through YAML scalars or JS template-literal parsing.
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/bench_results.md', 'utf8');

          if (!context.issue.number) {
            console.log('No PR context (push event) — skipping comment');
            return;
          }

          // Find existing benchmark comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.data.find(c =>
            c.body.includes('Sysbench-Style Benchmark')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }

    - name: Fail if benchmark exceeded ceiling
      if: steps.bench.outputs.exit_code != '0'
      run: |
        cat /tmp/bench_stderr.txt
        exit 1
