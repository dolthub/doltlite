name: Test Suite

on:
  workflow_call:

jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Download optimized build
      uses: actions/download-artifact@v4
      with:
        name: benchmark-build

    - name: Extract optimized build
      run: |
        tar -xzf benchmark-build.tar.gz
        mv build build-plain

    - name: Scaling curves
      run: |
        bash test/doltlite_scaling.sh --self-test
        bash test/doltlite_scaling.sh build-plain/doltlite

  concurrency-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Download checked build
      uses: actions/download-artifact@v4
      with:
        name: checked-build-ubuntu

    - name: Extract checked build
      run: tar -xzf checked-build-ubuntu.tar.gz

    - name: Run concurrency stress
      run: |
        cd build
        DOLTLITE_STRESS_SECONDS=480 ./concurrent_stress_test
      timeout-minutes: 9

  prolly-txn-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Download checked build
      uses: actions/download-artifact@v4
      with:
        name: checked-build-ubuntu

    - name: Extract checked build
      run: tar -xzf checked-build-ubuntu.tar.gz

    - name: Run prolly txn stress (loop)
      run: |
        cd build
        deadline=$((SECONDS + 300))
        runs=0
        while [ "$SECONDS" -lt "$deadline" ]; do
          runs=$((runs + 1))
          if [ $((runs % 20)) -eq 0 ]; then
            echo "prolly_txn_stress_test run ${runs}"
          fi
          ./prolly_txn_stress_test > /tmp/prolly_txn_stress.out || {
            cat /tmp/prolly_txn_stress.out
            exit 1
          }
        done
        echo "completed ${runs} prolly_txn_stress_test runs"
      timeout-minutes: 8

  vc-concurrency-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Download checked build
      uses: actions/download-artifact@v4
      with:
        name: checked-build-ubuntu

    - name: Extract checked build
      run: tar -xzf checked-build-ubuntu.tar.gz

    - name: Run version-control concurrency stress
      run: |
        cd build
        deadline=$((SECONDS + 480))
        runs=0
        while [ "$SECONDS" -lt "$deadline" ]; do
          runs=$((runs + 1))
          if [ $((runs % 100)) -eq 0 ]; then
            echo "vc_concurrency_test run ${runs}"
          fi
          ./vc_concurrency_test > /tmp/vc_concurrency_test.out || {
            cat /tmp/vc_concurrency_test.out
            exit 1
          }
        done
        echo "completed ${runs} vc_concurrency_test runs"
        ./vc_ref_mutation_stress_test
      timeout-minutes: 9

  thread-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh zlib1g-dev

    - name: Download checked build
      uses: actions/download-artifact@v4
      with:
        name: checked-build-ubuntu

    - name: Extract checked build
      run: tar -xzf checked-build-ubuntu.tar.gz

    - name: Run threadtest4 serialized
      run: |
        cd build
        rm -f tt4-test1.db tt4-test2.db tt4-test3.db
        ./threadtest4 --serialized 6

    - name: Run threadtest4 multithread
      run: |
        cd build
        rm -f tt4-test1.db tt4-test2.db tt4-test3.db
        ./threadtest4 --multithread 6

    - name: Run threadtest5
      env:
        # Match sanitizers.yml: multi-writer prolly runs on shared CI hosts
        # can exceed a short busy timeout and leave p1/p2 inconsistent.
        THREADTEST5_BUSY_MS: "60000"
      run: |
        cd build
        rm -f /tmp/doltlite-threadtest5.db
        ./threadtest5 'file:/tmp/doltlite-threadtest5.db?mode=rwc' -num-workers 8

  sqllogictest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: bash .github/scripts/install-apt-deps.sh zlib1g-dev unixodbc

    - name: Download sqllogictest build
      uses: actions/download-artifact@v4
      with:
        name: sqllogictest-build

    - name: Extract sqllogictest build
      run: tar -xzf sqllogictest-build.tar.gz

    - name: Run full sqllogictest suite
      run: |
        bash test/run_sqllogictest.sh \
          build/sqllogictest/src/sqllogictest-doltlite \
          build/sqllogictest/src/sqllogictest-stock \
          build/sqllogictest/test

  oracle-tests:
    name: oracle-tests-${{ matrix.bucket }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bucket:
          - refs-workspace
          - diff-history-data
          - merge-replay-schema
          - remotes-recovery
          - sql

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh build-essential zlib1g-dev

    - name: Download instrumented build
      uses: actions/download-artifact@v4
      with:
        name: coverage-build

    - name: Extract instrumented build
      run: |
        tar -xzf coverage-build.tar.gz
        mkdir -p "$RUNNER_TEMP/coverage-profiles"
        echo "LLVM_PROFILE_FILE=$RUNNER_TEMP/coverage-profiles/%8m.profraw" >> "$GITHUB_ENV"

    - name: Install Dolt
      run: |
        curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz \
          | sudo tar -xz -C /usr/local --strip-components=1
        dolt version

    - name: Check oracle bucket manifests
      run: bash test/check_oracle_buckets.sh

    - name: Version control oracle tests (vs Dolt)
      if: matrix.bucket != 'sql'
      run: |
        cd build-coverage
        while IFS= read -r oracle; do
          [ -z "$oracle" ] && continue
          echo "--- $oracle ---"
          bash "../test/$oracle" ./doltlite dolt || exit 1
        done < "../test/oracle-buckets/${{ matrix.bucket }}.txt"
      timeout-minutes: 18

    # Checked here too, not just where it is built: every suite below is a
    # comparison against this binary, and if it shares doltlite's storage they
    # all pass without testing anything.
    - name: Assert the stock reference does not share doltlite's storage
      if: matrix.bucket == 'sql'
      run: |
        bash test/assert_stock_reference.sh \
          build-coverage/sqlite3-stock build-coverage/doltlite

    - name: SQL oracle tests (vs stock SQLite)
      if: matrix.bucket == 'sql'
      run: |
        cd build-coverage
        bash ../test/sql_oracle_test.sh ./doltlite ./sqlite3-stock || exit 1
        bash ../test/oracle_import_test.sh ./doltlite dolt || exit 1
        for f in ../test/oracle_*_test.sh; do
          [ "$(basename $f)" = "oracle_import_test.sh" ] && continue
          echo "--- $(basename $f) ---"
          bash "$f" ./doltlite ./sqlite3-stock || exit 1
        done
      timeout-minutes: 10

    - name: Upload oracle coverage profiles
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-profile-oracles-${{ matrix.bucket }}
        path: ${{ runner.temp }}/coverage-profiles
        if-no-files-found: warn
        retention-days: 1

  sqlite-regression:
    name: sqlite-regression-${{ matrix.bucket }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTFIXTURE_VARIANT: coverage
    strategy:
      fail-fast: false
      matrix:
        bucket:
          - core-sql
          - ddl-schema
          - storage
          - fault-fuzz
          - fts3
          - fts4-core
          - fts4-merge
          - ported
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh build-essential zlib1g-dev

    - name: Download instrumented build
      uses: actions/download-artifact@v4
      with:
        name: coverage-build

    - name: Extract instrumented build
      run: |
        tar -xzf coverage-build.tar.gz
        mkdir -p "$RUNNER_TEMP/coverage-profiles"
        echo "LLVM_PROFILE_FILE=$RUNNER_TEMP/coverage-profiles/%8m.profraw" >> "$GITHUB_ENV"

    # Inherited upstream SQLite .test files that pass clean (or only with
    # already-recorded divergences) against doltlite, swept and gated under
    # issue #1208. Split into semantic buckets (test/regression-buckets/)
    # so the jobs parallelize and a red bucket names the broken area. The
    # "ported" bucket holds doltlite-native rewrites of gated divergences
    # (#1313): zero-divergence files asserting the intent the upstream
    # entries lost. Every file belongs to:
    # core-sql, ddl-schema, storage, fault-fuzz, fts3, fts4-core,
    # fts4-merge. A file must appear in exactly one bucket; the guard below
    # enforces it. Nondeterministic-class files (thread*, walcrash*,
    # writecrash, wal*fault) stay excluded, same rationale as the crash.test
    # exclusion. fts3.test is also excluded: it is the permutations
    # suite-runner that re-sources the fts3 family inline (pure double
    # coverage of files already in the FTS buckets), and its inlined OOM
    # sections fail load-sensitively.
    - name: Check regression coverage manifests
      run: |
        dups=$(cat test/regression-buckets/*.txt | sort | uniq -d)
        if [ -n "$dups" ]; then
          echo "::error::files in more than one regression bucket:"; echo "$dups"; exit 1
        fi
        bash test/check_testfixture_crash_coverage.sh
        bash test/check_testfixture_crash_coverage_test.sh
        bash test/check_testfixture_exception_inventory.sh
        bash test/check_testfixture_exception_inventory_test.sh
        bash test/run_testfixture_test.sh
        bash test/check_testfixture_inventory_issues_alive_test.sh

    - name: SQLite regression tests - ${{ matrix.bucket }}
      run: |
        cd build-coverage
        # bigsort alone runs ~260s healthy; with DOLTLITE_PROLLY_CHECK=1 and
        # runner load it has crossed 450s and flaked as "did not produce
        # summary line" (timeout kill). Give ~10 min per file.
        bash ../test/run_testfixture.sh "SQLite regression ${{ matrix.bucket }}" 600 \
          $(tr '\n' ' ' < ../test/regression-buckets/${{ matrix.bucket }}.txt)

    - name: Upload regression coverage profiles
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-profile-regression-${{ matrix.bucket }}
        path: ${{ runner.temp }}/coverage-profiles
        if-no-files-found: warn
        retention-days: 1

  coverage-native:
    name: coverage-native-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: clang
      CFLAGS: -O1 -g -fprofile-instr-generate -fcoverage-mapping
      LDFLAGS: -fprofile-instr-generate
      DOLTLITE_REGRESSION_PREBUILT: 1
      DOLTLITE_BLAKE3_KAT_BIN: ${{ github.workspace }}/build-coverage/blake3_kat_test
    strategy:
      fail-fast: false
      matrix:
        suite: [shell, c]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential clang zlib1g-dev

    - name: Download instrumented build
      uses: actions/download-artifact@v4
      with:
        name: coverage-build

    - name: Extract instrumented build
      run: |
        tar -xzf coverage-build.tar.gz
        mkdir -p "$RUNNER_TEMP/coverage-profiles"
        echo "LLVM_PROFILE_FILE=$RUNNER_TEMP/coverage-profiles/%8m.profraw" >> "$GITHUB_ENV"

    - name: Deterministic shell tests
      if: matrix.suite == 'shell'
      run: |
        # The parity suite needs the stock reference at ./sqlite3. Keep that
        # alias local to this job so Tcl regression tests do not discover and
        # run external-shell suites that the prior testfixture-only build skipped.
        ln -s sqlite3-stock build-coverage/sqlite3
        DOLTLITE_BUILD_DIR="$PWD/build-coverage" \
          DOLTLITE_SUITE_SET=coverage \
          bash test/run_doltlite_tests.sh
        cd build-coverage
        bash ../test/correctness_test.sh ./doltlite
        bash ../test/index_test.sh ./doltlite
        bash ../test/diff_test.sh ./doltlite
        bash ../test/config_test.sh ./doltlite
        bash ../test/blake3_kat_test.sh ./doltlite

    - name: Deterministic C tests
      if: matrix.suite == 'c'
      run: bash test/run_c_tests.sh build-coverage coverage

    - name: Upload native coverage profiles
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-profile-native-${{ matrix.suite }}
        path: ${{ runner.temp }}/coverage-profiles
        if-no-files-found: warn
        retention-days: 1

  coverage-remotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential openssl python3 zlib1g-dev

    - name: Download instrumented build
      uses: actions/download-artifact@v4
      with:
        name: coverage-build

    - name: Extract instrumented build
      run: |
        tar -xzf coverage-build.tar.gz
        mkdir -p "$RUNNER_TEMP/coverage-profiles"
        echo "LLVM_PROFILE_FILE=$RUNNER_TEMP/coverage-profiles/%8m.profraw" >> "$GITHUB_ENV"

    - name: Credential, TLS, and HTTP remote tests
      run: |
        cd build-coverage
        bash ../test/creds_path_test.sh ./doltlite
        bash ../test/remote_https_auth_test.sh ./doltlite ./doltlite-remotesrv
        bash ../test/http_remote_content_length_test.sh ./doltlite ./doltlite-remotesrv
        bash ../test/remotesrv_http_test.sh ./doltlite ./doltlite-remotesrv
        bash ../test/remotesrv_bind_warning_test.sh ./doltlite ./doltlite-remotesrv
        bash ../test/remotesrv_http_concurrency_test.sh ./doltlite ./doltlite-remotesrv
        bash ../test/remotesrv_stall_test.sh ./doltlite ./doltlite-remotesrv
        bash ../test/remotesrv_http_partial_failure_test.sh ./doltlite ./doltlite-remotesrv
        bash ../test/remotesrv_http_force_push_test.sh ./doltlite ./doltlite-remotesrv

    - name: Upload remote coverage profiles
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-profile-remotes
        path: ${{ runner.temp }}/coverage-profiles
        if-no-files-found: warn
        retention-days: 1

  source-coverage:
    needs:
      - oracle-tests
      - sqlite-regression
      - coverage-native
      - coverage-remotes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Install coverage tools
      run: |
        bash .github/scripts/install-apt-deps.sh llvm

    - name: Download instrumented build
      uses: actions/download-artifact@v4
      with:
        name: coverage-build

    - name: Extract instrumented build
      run: tar -xzf coverage-build.tar.gz

    - name: Download coverage profiles
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-profile-*
        path: coverage-profiles

    - name: Generate source coverage report
      env:
        DOLTLITE_COVERAGE_MIN_LINES: 80
      run: |
        bash test/source_coverage_report.sh \
          build-coverage coverage-profiles coverage-report
        cat coverage-report/summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment PR with source coverage
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync(
            'coverage-report/summary.md',
            'utf8'
          );
          const marker = '<!-- coverage:source -->';
          const runUrl = [
            context.serverUrl,
            context.repo.owner,
            context.repo.repo,
            'actions',
            'runs',
            context.runId,
          ].join('/');
          const body = [
            marker,
            summary.trim(),
            '',
            `[Download HTML and LCOV artifacts from this workflow run.](${runUrl})`,
          ].join('\n');

          if (!context.issue.number) {
            console.log('No PR context — skipping coverage comment');
            return;
          }

          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            }
          );
          const existing = comments.find(comment =>
            comment.body.includes(marker)
          );
          const target = {
            owner: context.repo.owner,
            repo: context.repo.repo,
          };

          if (existing) {
            await github.rest.issues.updateComment({
              ...target,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              ...target,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Upload source coverage report
      uses: actions/upload-artifact@v4
      with:
        name: doltlite-source-coverage
        path: coverage-report
        retention-days: 14

  # Cross-version database compatibility: fixtures built by pinned old
  # release tags must open + pass feature smoke tests when the on-disk
  # format signature is unchanged, and must be refused cleanly when it
  # differs. Format changes without a minor version bump fail the suite.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh tcl-dev build-essential zlib1g-dev

    - name: Download checked build
      uses: actions/download-artifact@v4
      with:
        name: checked-build-ubuntu

    - name: Download compatibility references
      uses: actions/download-artifact@v4
      with:
        name: compat-build

    - name: Extract prebuilt binaries
      run: |
        tar -xzf checked-build-ubuntu.tar.gz
        tar -xzf compat-build.tar.gz

    - name: Cross-version compatibility tests
      env:
        DOLTLITE_COMPAT_PREBUILT: 1
      run: bash test/doltlite_compat_test.sh build/doltlite
