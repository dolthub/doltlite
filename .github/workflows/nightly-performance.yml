name: Nightly performance

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Paired repetitions for each sysbench-style workload
        required: false
        default: "55"
      vc-runs:
        description: Repetitions for each version-control benchmark
        required: false
        default: "101"
      source_run_id:
        description: Existing nightly run ID to republish without benchmarking
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: nightly-performance
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.source_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential tcl-dev zlib1g-dev

    - name: Configure
      run: |
        mkdir build-nightly
        cd build-nightly
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build DoltLite and SQLite benchmark binaries
      run: |
        cd build-nightly
        set -o pipefail
        {
          make -j2 doltlite doltlite-lib
          cc -O2 -Werror -I. -I../src \
            -o bench_timer_doltlite ../test/sysbench_timer.c \
            libdoltlite.a -lpthread -lz -lm
          # The baseline links sqlite3.o, so it comes from the reference
          # directory: an object compiled from an amalgamation generated with
          # the prolly storage would make this baseline another doltlite.
          bash ../test/build_stock_reference.sh ../build-stockref ./doltlite
          cc -O2 -Werror -I../build-stockref -I../src \
            -o bench_timer_sqlite ../test/sysbench_timer.c \
            ../build-stockref/sqlite3.o -lpthread -lz -lm
        } 2>&1 | tee build.log
        if grep -E "warning:" build.log; then
          echo "::error::compiler warnings in nightly benchmark build"
          exit 1
        fi

    - name: Package
      run: tar -czf nightly-benchmark-build.tar.gz build-nightly

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: nightly-benchmark-build
        path: nightly-benchmark-build.tar.gz
        retention-days: 1

  sysbench:
    name: ${{ matrix.suite.name }}-keys
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: int
            script: sysbench_compare.sh
          - name: textpk
            script: sysbench_compare_textpk.sh
          - name: blobpk
            script: sysbench_compare_blobpk.sh
          - name: compositepk
            script: sysbench_compare_compositepk.sh

    steps:
    - uses: actions/checkout@v4

    - name: Download nightly benchmark build
      uses: actions/download-artifact@v4
      with:
        name: nightly-benchmark-build

    - name: Extract nightly benchmark build
      run: tar -xzf nightly-benchmark-build.tar.gz

    - name: Run absolute benchmark
      id: benchmark
      env:
        BENCH_RUNS: ${{ github.event.inputs.runs || '55' }}
        BENCH_AC_WRITE_RUNS: ${{ github.event.inputs.runs || '55' }}
      run: |
        results="$RUNNER_TEMP/nightly-results"
        mkdir -p "$results"
        started_at=$(date +%s)
        set +e
        (
          cd build-nightly
          BENCH_RESULTS_OUTPUT="$results/${{ matrix.suite.name }}.tsv" \
            BENCH_SAMPLES_OUTPUT="$results/${{ matrix.suite.name }}-samples.tsv" \
            bash "../test/${{ matrix.suite.script }}"
        ) > "$results/${{ matrix.suite.name }}.md" \
          2> "$results/${{ matrix.suite.name }}.stderr"
        bench_rc=$?
        set -e
        finished_at=$(date +%s)
        echo "$bench_rc" > "$results/${{ matrix.suite.name }}.status"
        echo "$((finished_at - started_at))" \
          > "$results/${{ matrix.suite.name }}.duration"
        cat "$results/${{ matrix.suite.name }}.md"
        cat "$results/${{ matrix.suite.name }}.stderr" >&2
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Upload nightly measurements
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-performance-${{ matrix.suite.name }}
        path: ${{ runner.temp }}/nightly-results
        retention-days: 30

    - name: Enforce absolute ceiling
      if: always()
      run: |
        rc="${{ steps.benchmark.outputs.bench_rc }}"
        if [ -z "$rc" ]; then rc=1; fi
        exit "$rc"

  version-control:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
    - uses: actions/checkout@v4

    - name: Download nightly benchmark build
      uses: actions/download-artifact@v4
      with:
        name: nightly-benchmark-build

    - name: Extract nightly benchmark build
      run: tar -xzf nightly-benchmark-build.tar.gz

    - name: Run absolute version-control benchmark
      id: benchmark
      env:
        VC_PERF_RUNS: ${{ github.event.inputs.vc-runs || '101' }}
      run: |
        results="$RUNNER_TEMP/nightly-results"
        mkdir -p "$results"
        started_at=$(date +%s)
        set +e
        (
          cd build-nightly
          VC_PERF_RESULTS_OUTPUT="$results/vc.tsv" \
            VC_PERF_SAMPLES_OUTPUT="$results/vc-samples.tsv" \
            bash ../test/vc_perf_ceiling.sh ./doltlite
        ) > "$results/vc.md" 2> "$results/vc.stderr"
        bench_rc=$?
        set -e
        finished_at=$(date +%s)
        echo "$bench_rc" > "$results/vc.status"
        echo "$((finished_at - started_at))" > "$results/vc.duration"
        cat "$results/vc.md"
        cat "$results/vc.stderr" >&2
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Upload nightly measurements
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-performance-vc
        path: ${{ runner.temp }}/nightly-results
        retention-days: 30

    - name: Enforce absolute ceiling
      if: always()
      run: |
        rc="${{ steps.benchmark.outputs.bench_rc }}"
        if [ -z "$rc" ]; then rc=1; fi
        exit "$rc"

  report:
    if: ${{ always() && !cancelled() }}
    needs:
      - sysbench
      - version-control
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Download nightly measurements
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: nightly-performance-*
        path: nightly-results
        merge-multiple: true
        repository: ${{ github.repository }}
        run-id: ${{ inputs.source_run_id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Test report generation and publication guards
      run: |
        python3 test/nightly_performance_report_test.py
        python3 test/publish_performance_report_test.py

    - name: Compose nightly report
      id: report
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      run: |
        summary="$RUNNER_TEMP/performance-report.md"
        report_result="$RUNNER_TEMP/performance-report.result"
        issue_body="$RUNNER_TEMP/nightly-performance-failure.md"
        generator_stderr="$RUNNER_TEMP/performance-report.stderr"
        suites="int textpk blobpk compositepk vc"
        failed=0
        valid=1
        generated_at=$(date -u '+%Y-%m-%d %H:%M UTC')
        generated_date=$(date -u '+%Y-%m-%d')
        report_commit="$GITHUB_SHA"
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        if [ -n "$SOURCE_RUN_ID" ]; then
          source_name=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '.name')
          source_branch=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '.head_branch')
          if [ "$source_name" != "Nightly performance" ] ||
             [ "$source_branch" != "master" ]; then
            echo "::error::source run must be a master Nightly performance run"
            exit 1
          fi
          report_commit=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '.head_sha')
          source_created_at=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '.created_at')
          generated_date=$(date -u -d "$source_created_at" '+%Y-%m-%d')
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
        fi
        {
          echo "Nightly performance failed or produced incomplete results."
          echo ""
        } > "$issue_body"

        for suite in $suites; do
          status_file="nightly-results/$suite.status"
          stderr_file="nightly-results/$suite.stderr"
          status=1
          if [ -s "$status_file" ]; then
            status=$(cat "$status_file")
          fi
          if [ "$status" != "0" ]; then
            failed=1
            {
              echo "### ${suite}"
              echo ""
              if [ -s "$stderr_file" ]; then
                echo '```text'
                tail -n 80 "$stderr_file"
                echo '```'
              else
                echo "Benchmark did not produce diagnostic output."
              fi
              echo ""
            } >> "$issue_body"
          fi
        done

        set +e
        python3 test/nightly_performance_report.py \
          --results-dir nightly-results \
          --commit "$report_commit" \
          --run-url "$run_url" \
          --generated-at "$generated_at" \
          --runner "${ImageOS:-ubuntu-latest} ${ImageVersion:-}" \
          --output "$summary" \
          --result-output "$report_result" \
          2> "$generator_stderr"
        generator_rc=$?
        set -e
        if [ "$generator_rc" -ne 0 ]; then
          valid=0
          failed=1
          {
            echo "### Report generation"
            echo ""
            echo '```text'
            cat "$generator_stderr"
            echo '```'
          } >> "$issue_body"
          {
            echo "## Nightly DoltLite performance"
            echo ""
            echo "**FAILED:** unable to generate the checked-in report."
            echo ""
            echo '```text'
            cat "$generator_stderr"
            echo '```'
          } > "$summary"
        elif [ "$(cat "$report_result")" = "FAIL" ]; then
          failed=1
          {
            echo "### Performance ceiling"
            echo ""
            echo "One or more performance ceilings were exceeded."
            echo ""
          } >> "$issue_body"
        fi

        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        cp "$summary" nightly-results/performance-report.md
        cp "$issue_body" nightly-results/failure.md
        echo "failed=$failed" >> "$GITHUB_OUTPUT"
        echo "valid=$valid" >> "$GITHUB_OUTPUT"
        echo "report=$summary" >> "$GITHUB_OUTPUT"
        echo "issue_body=$issue_body" >> "$GITHUB_OUTPUT"
        echo "generated_date=$generated_date" >> "$GITHUB_OUTPUT"
        echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

    - name: Upload combined nightly report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-performance-report
        path: nightly-results
        retention-days: 30

    - name: Report regression as GitHub issue
      if: >-
        ${{ always() &&
            github.ref == 'refs/heads/master' &&
            steps.report.outputs.failed == '1' }}
      uses: ./.github/actions/report-failure-issue
      with:
        label: nightly-performance-regression
        title: "Nightly performance regression"
        body-file: ${{ steps.report.outputs.issue_body }}
        token: ${{ secrets.GITHUB_TOKEN }}
        label-description: Nightly absolute performance ceiling failure

    - name: Publish rolling performance report PR
      if: >-
        ${{ always() &&
            (github.ref == 'refs/heads/master' ||
             inputs.source_run_id != '') &&
            steps.report.outputs.valid == '1' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PERFORMANCE_REPORT_REVIEWER: ${{ vars.PERFORMANCE_REPORT_REVIEWER }}
      run: |
        python3 tool/publish-performance-report.py \
          --report "${{ steps.report.outputs.report }}" \
          --repository "$GITHUB_REPOSITORY" \
          --run-id "$GITHUB_RUN_ID" \
          --run-attempt "$GITHUB_RUN_ATTEMPT" \
          --run-url "${{ steps.report.outputs.run_url }}" \
          --generated-date "${{ steps.report.outputs.generated_date }}" \
          --reviewer "$PERFORMANCE_REPORT_REVIEWER"

    - name: Fail when a ceiling regressed
      if: ${{ always() && steps.report.outputs.failed == '1' }}
      run: exit 1
