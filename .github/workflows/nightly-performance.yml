name: Nightly performance

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      vc-runs:
        description: Repetitions for each version-control benchmark
        required: false
        default: "101"
      remote-runs:
        description: Repetitions for each 100 MB file-remote benchmark
        required: false
        default: "5"
      remote-scale-runs:
        description: Repetitions for each observational 1 GB file-remote benchmark
        required: false
        default: "3"
      source_run_id:
        description: Existing nightly run ID to republish without benchmarking
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: nightly-performance
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.source_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential tcl-dev zlib1g-dev

    - name: Configure
      run: |
        mkdir build-nightly
        cd build-nightly
        TCL_CONFIG=$(find /usr/lib -name tclConfig.sh -print -quit 2>/dev/null)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname "$TCL_CONFIG")
        else
          ../configure
        fi

    - name: Build DoltLite and SQLite benchmark binaries
      run: |
        cd build-nightly
        set -o pipefail
        {
          make -j2 doltlite doltlite-lib
          cc -O2 -Werror -I. -I../src \
            -o bench_timer_doltlite ../test/sysbench_timer.c \
            libdoltlite.a -lpthread -lz -lm
          # The baseline links sqlite3.o, so it comes from the reference
          # directory: an object compiled from an amalgamation generated with
          # the prolly storage would make this baseline another doltlite.
          bash ../test/build_stock_reference.sh ../build-stockref ./doltlite
          cc -O2 -Werror -I../build-stockref -I../src \
            -o bench_timer_sqlite ../test/sysbench_timer.c \
            ../build-stockref/sqlite3.o -lpthread -lz -lm
        } 2>&1 | tee build.log
        if grep -E "warning:" build.log; then
          echo "::error::compiler warnings in nightly benchmark build"
          exit 1
        fi

    - name: Build file-remote metrics extension
      run: |
        cc -O2 -Werror -fPIC -shared -Ibuild-nightly -Isrc \
          test/remote_perf_metrics.c -o build-nightly/remote_perf_metrics.so

    - name: Package
      run: tar -czf nightly-benchmark-build.tar.gz build-nightly

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: nightly-benchmark-build
        path: nightly-benchmark-build.tar.gz
        retention-days: 1

  sysbench:
    name: ${{ matrix.suite.name }}-keys
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: int
            script: sysbench_compare.sh
          - name: textpk
            script: sysbench_compare_textpk.sh
          - name: blobpk
            script: sysbench_compare_blobpk.sh
          - name: compositepk
            script: sysbench_compare_compositepk.sh

    steps:
    - uses: actions/checkout@v4

    - name: Download nightly benchmark build
      uses: actions/download-artifact@v4
      with:
        name: nightly-benchmark-build

    - name: Extract nightly benchmark build
      run: tar -xzf nightly-benchmark-build.tar.gz

    - name: Run absolute benchmark
      id: benchmark
      env:
        BENCH_RUNS: "55"
        BENCH_AC_WRITE_RUNS: "55"
        BENCH_MAX_MULTIPLIER: 2.3
        BENCH_AVG_MAX_MULTIPLIER: 1.9
        BENCH_AC_WRITE_MAX_MULTIPLIER: 5.5
        BENCH_AC_WRITE_AVG_MAX_MULTIPLIER: 5
      run: |
        results="$RUNNER_TEMP/nightly-results"
        mkdir -p "$results"
        started_at=$(date +%s)
        set +e
        (
          cd build-nightly
          BENCH_RESULTS_OUTPUT="$results/${{ matrix.suite.name }}.tsv" \
            BENCH_SAMPLES_OUTPUT="$results/${{ matrix.suite.name }}-samples.tsv" \
            bash "../test/${{ matrix.suite.script }}"
        ) > "$results/${{ matrix.suite.name }}.md" \
          2> "$results/${{ matrix.suite.name }}.stderr"
        bench_rc=$?
        set -e
        finished_at=$(date +%s)
        echo "$bench_rc" > "$results/${{ matrix.suite.name }}.status"
        echo "$((finished_at - started_at))" \
          > "$results/${{ matrix.suite.name }}.duration"
        cat "$results/${{ matrix.suite.name }}.md"
        cat "$results/${{ matrix.suite.name }}.stderr" >&2
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Upload nightly measurements
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-performance-${{ matrix.suite.name }}
        path: ${{ runner.temp }}/nightly-results
        retention-days: 30

    - name: Enforce absolute ceiling
      if: always()
      run: |
        rc="${{ steps.benchmark.outputs.bench_rc }}"
        if [ -z "$rc" ]; then rc=1; fi
        exit "$rc"

  version-control:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
    - uses: actions/checkout@v4

    - name: Download nightly benchmark build
      uses: actions/download-artifact@v4
      with:
        name: nightly-benchmark-build

    - name: Extract nightly benchmark build
      run: tar -xzf nightly-benchmark-build.tar.gz

    - name: Run absolute version-control benchmark
      id: benchmark
      env:
        VC_PERF_RUNS: ${{ github.event.inputs.vc-runs || '101' }}
      run: |
        results="$RUNNER_TEMP/nightly-results"
        mkdir -p "$results/remote"
        echo 1 > "$results/remote.status"
        touch "$results/remote-1gb.expected"
        started_at=$(date +%s)
        set +e
        (
          cd build-nightly
          VC_PERF_GATE_MODE=none python3 ../test/benchmark_retry.py \
            --suite vc \
            --results-dir "$results" \
            --max-attempts 3 \
            --individual-ratio 1.0 \
            --aggregate-ratio 1000 \
            --min-delta-us 0 \
            --individual-min-delta-us 0 \
            --fail-confirmed \
            -- bash ../test/vc_perf_ceiling.sh ./doltlite
        ) > "$results/vc.retry.log" 2> "$results/vc.stderr"
        bench_rc=$?
        set -e
        finished_at=$(date +%s)
        echo "$bench_rc" > "$results/vc.status"
        echo "$((finished_at - started_at))" > "$results/vc.duration"
        cat "$results/vc.retry.log"
        cat "$results/vc.md"
        cat "$results/vc.stderr" >&2
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Run 100 MB file-remote benchmark
      id: remote
      if: ${{ !cancelled() }}
      env:
        REMOTE_PERF_RUNS: ${{ github.event.inputs.remote-runs || '5' }}
      run: |
        results="$RUNNER_TEMP/nightly-results"
        mkdir -p "$results/remote"
        echo 1 > "$results/remote.status"
        set +e
        python3 test/benchmark_retry.py \
          --suite remote --results-dir "$results/remote" \
          --max-attempts 3 --individual-ratio 1.0 --aggregate-ratio 1000 \
          --min-delta-us 0 --individual-min-delta-us 0 --fail-confirmed \
          --extra-artifact results.json --extra-artifact samples.tsv --extra-artifact report.md \
          -- python3 test/remote_perf.py \
          --candidate "$GITHUB_WORKSPACE/build-nightly/doltlite" \
          --size-mb 100 --delta-rows 1000 --runs "$REMOTE_PERF_RUNS" --benchmark-output \
          --metrics-extension "$GITHUB_WORKSPACE/build-nightly/remote_perf_metrics.so" \
          > "$results/remote.log" 2> "$results/remote.stderr"
        bench_rc=$?
        set -e
        echo "$bench_rc" > "$results/remote.status"
        cat "$results/remote.log"
        cat "$results/remote.stderr" >&2
        if [ -s "$results/remote/report.md" ]; then cat "$results/remote/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Upload nightly measurements
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-performance-vc
        path: ${{ runner.temp }}/nightly-results
        retention-days: 30

    - name: Enforce version-control results
      if: always()
      run: |
        rc="${{ steps.benchmark.outputs.bench_rc }}"
        remote_rc="${{ steps.remote.outputs.bench_rc }}"
        if [ -z "$rc" ]; then rc=1; fi
        if [ "$remote_rc" != 0 ]; then rc=1; fi
        exit "$rc"

  remote-scale:
    needs: [build, sysbench, version-control]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Initialize 1 GB result status
      run: |
        mkdir -p "$RUNNER_TEMP/nightly-results"
        echo 1 > "$RUNNER_TEMP/nightly-results/remote-1gb.status"

    - uses: actions/checkout@v4

    - name: Download nightly benchmark build
      uses: actions/download-artifact@v4
      with:
        name: nightly-benchmark-build

    - name: Extract nightly benchmark build
      run: tar -xzf nightly-benchmark-build.tar.gz

    - name: Run 1 GB file-remote benchmark
      id: remote-scale
      if: ${{ !cancelled() }}
      env:
        REMOTE_SCALE_RUNS: ${{ github.event.inputs.remote-scale-runs || '3' }}
      run: |
        results="$RUNNER_TEMP/nightly-results"
        mkdir -p "$results/remote-1gb"
        echo 1 > "$results/remote-1gb.status"
        started_at=$(date +%s)
        set +e
        python3 test/remote_perf.py \
          --candidate "$GITHUB_WORKSPACE/build-nightly/doltlite" \
          --size-mb 1000 --delta-rows 1000 --runs "$REMOTE_SCALE_RUNS" \
          --metrics-extension "$GITHUB_WORKSPACE/build-nightly/remote_perf_metrics.so" \
          --output-dir "$results/remote-1gb" > "$results/remote-1gb.log" 2> "$results/remote-1gb.stderr"
        bench_rc=$?
        set -e
        echo "$bench_rc" > "$results/remote-1gb.status"
        finished_at=$(date +%s)
        echo "$((finished_at - started_at))" > "$results/remote-1gb.duration"
        cat "$results/remote-1gb.log"
        cat "$results/remote-1gb.stderr" >&2
        if [ -s "$results/remote-1gb/report.md" ]; then cat "$results/remote-1gb/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
        echo "bench_rc=$bench_rc" >> "$GITHUB_OUTPUT"

    - name: Upload 1 GB measurements
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-performance-remote-scale
        path: ${{ runner.temp }}/nightly-results
        retention-days: 30

    - name: Enforce 1 GB results
      if: always()
      run: |
        rc="${{ steps.remote-scale.outputs.bench_rc }}"
        if [ -z "$rc" ]; then rc=1; fi
        exit "$rc"

  report:
    if: ${{ always() && !cancelled() }}
    needs:
      - sysbench
      - version-control
      - remote-scale
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Download nightly measurements
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: nightly-performance-*
        path: nightly-results
        merge-multiple: true
        repository: ${{ github.repository }}
        run-id: ${{ inputs.source_run_id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Test report generation and publication guards
      run: |
        python3 test/nightly_performance_report_test.py
        python3 test/publish_performance_report_test.py

    - name: Compose nightly report
      id: report
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      run: |
        summary="$RUNNER_TEMP/performance-report.md"
        report_result="$RUNNER_TEMP/performance-report.result"
        issue_body="$RUNNER_TEMP/nightly-performance-failure.md"
        generator_stderr="$RUNNER_TEMP/performance-report.stderr"
        suites="int textpk blobpk compositepk vc"
        failed=0
        valid=1
        generated_at=$(date -u '+%Y-%m-%d %H:%M UTC')
        generated_date=$(date -u '+%Y-%m-%d')
        report_commit="$GITHUB_SHA"
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        if [ -n "$SOURCE_RUN_ID" ]; then
          source_name=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '.name')
          source_branch=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '.head_branch')
          if [ "$source_name" != "Nightly performance" ] ||
             [ "$source_branch" != "master" ]; then
            echo "::error::source run must be a master Nightly performance run"
            exit 1
          fi
          report_commit=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '.head_sha')
          source_created_at=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '.created_at')
          generated_date=$(date -u -d "$source_created_at" '+%Y-%m-%d')
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
        fi
        {
          echo "Nightly performance failed or produced incomplete results."
          echo ""
          echo "Ceilings compare this run with SQLite or a fixed latency limit."
          echo "They do not establish a slowdown from a previous DoltLite revision."
          echo "1 GB remote timings are observational; verification, metrics and command failures block."
          echo ""
        } > "$issue_body"

        remote_args=(--remote-results-dir nightly-results/remote)
        if [ -z "$SOURCE_RUN_ID" ]; then remote_args+=(--remote-gates); fi
        if [ -n "$SOURCE_RUN_ID" ] && [ ! -d nightly-results/remote ]; then
          remote_args=()
        else
          suites="$suites remote"
        fi
        if [ -z "$SOURCE_RUN_ID" ] || [ -d nightly-results/remote-1gb ] ||
           [ -e nightly-results/remote-1gb.status ] ||
           [ -e nightly-results/remote-1gb.expected ]; then
          remote_args+=(--remote-scale-results-dir nightly-results/remote-1gb)
          suites="$suites remote-1gb"
        fi

        for suite in $suites; do
          status_file="nightly-results/$suite.status"
          stderr_file="nightly-results/$suite.stderr"
          status=1
          if [ -s "$status_file" ]; then
            status=$(cat "$status_file")
          fi
          if [ "$status" != "0" ]; then
            failed=1
            {
              echo "### ${suite}"
              echo ""
              if [ -s "$stderr_file" ]; then
                echo '```text'
                tail -n 80 "$stderr_file"
                echo '```'
              else
                echo "Benchmark did not produce diagnostic output."
              fi
              echo ""
            } >> "$issue_body"
          fi
        done

        set +e
        python3 test/nightly_performance_report.py \
          "${remote_args[@]}" \
          --results-dir nightly-results \
          --commit "$report_commit" \
          --run-url "$run_url" \
          --generated-at "$generated_at" \
          --runner "${ImageOS:-ubuntu-latest} ${ImageVersion:-}" \
          --output "$summary" \
          --result-output "$report_result" \
          2> "$generator_stderr"
        generator_rc=$?
        set -e
        report_result_value=""
        if [ "$generator_rc" -eq 0 ] && [ -s "$report_result" ]; then
          report_result_value=$(cat "$report_result") || report_result_value=""
        fi
        if [ "$generator_rc" -ne 0 ]; then
          valid=0
          failed=1
          {
            echo "### Report generation"
            echo ""
            echo '```text'
            cat "$generator_stderr"
            echo '```'
          } >> "$issue_body"
          {
            echo "## Nightly DoltLite performance"
            echo ""
            echo "**FAILED:** unable to generate the checked-in report."
            echo ""
            echo '```text'
            cat "$generator_stderr"
            echo '```'
          } > "$summary"
        elif [ "$report_result_value" = "FAIL" ]; then
          failed=1
          {
            echo "### Performance checks"
            echo ""
            echo "One or more performance ceilings or file-remote verification checks failed."
            echo ""
          } >> "$issue_body"
        elif [ "$report_result_value" != "PASS" ]; then
          valid=0
          failed=1
          {
            echo "### Report classification"
            echo ""
            echo "The machine-readable report result was missing or invalid."
            echo ""
          } >> "$issue_body"
          {
            echo "## Nightly DoltLite performance"
            echo ""
            echo "**FAILED:** missing or invalid report classification."
          } > "$summary"
        fi

        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        cp "$summary" nightly-results/performance-report.md
        cp "$issue_body" nightly-results/failure.md
        echo "failed=$failed" >> "$GITHUB_OUTPUT"
        echo "valid=$valid" >> "$GITHUB_OUTPUT"
        echo "report=$summary" >> "$GITHUB_OUTPUT"
        echo "issue_body=$issue_body" >> "$GITHUB_OUTPUT"
        echo "generated_date=$generated_date" >> "$GITHUB_OUTPUT"
        echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

    - name: Upload combined nightly report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-performance-report
        path: nightly-results
        retention-days: 30

    - name: Report nightly failure as GitHub issue
      if: >-
        ${{ always() &&
            github.ref == 'refs/heads/master' &&
            steps.report.outputs.failed == '1' }}
      uses: ./.github/actions/report-failure-issue
      with:
        label: nightly-performance-regression
        title: "Nightly performance failure"
        body-file: ${{ steps.report.outputs.issue_body }}
        token: ${{ secrets.GITHUB_TOKEN }}
        label-description: Nightly absolute performance ceiling failure

    # The release bot token opens the PR as a repository member, so its CI
    # runs without a manual approval; the workflow token would author it as
    # the GitHub Actions app, which the repository holds for approval.
    - name: Publish rolling performance report PR
      if: >-
        ${{ always() &&
            (github.ref == 'refs/heads/master' ||
             inputs.source_run_id != '') &&
            steps.report.outputs.valid == '1' }}
      env:
        GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      run: |
        python3 tool/publish-performance-report.py \
          --report "${{ steps.report.outputs.report }}" \
          --repository "$GITHUB_REPOSITORY" \
          --run-id "$GITHUB_RUN_ID" \
          --run-attempt "$GITHUB_RUN_ATTEMPT" \
          --run-url "${{ steps.report.outputs.run_url }}" \
          --generated-date "${{ steps.report.outputs.generated_date }}"

    - name: Fail when performance checks fail
      if: ${{ always() && steps.report.outputs.failed == '1' }}
      run: exit 1

  # A red or cancelled night must never be silent. Specific failures above
  # cut their own issues; this catches the classes they cannot: a setup or
  # build step failing before the reporter arms, or a job cancelled while
  # the run survives. A whole-run cancellation kills this job too, which is
  # what the weekly nightly-heartbeat exists to catch.
  watchdog:
    needs: [build, sysbench, version-control, remote-scale, report]
    if: failure() || cancelled()
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Skip when a step-level reporter already covered this run
      id: sibling
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        LABEL_PREFIXES: "nightly-performance-regression"
      run: |
        started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
        covered=0
        for prefix in nightly-performance-regression; do
          n=$(gh api -X GET "repos/${{ github.repository }}/issues" \
                -f state=all -f per_page=50 -f sort=updated -f direction=desc \
              | jq --arg p "$prefix" --arg t "$started" --arg w "nightly-performance-watchdog" \
                  '[.[] | select([.labels[].name] | any(startswith($p) and . != $w)) | select(.updated_at >= $t)] | length')
          [ "${n:-0}" -gt 0 ] && covered=1
        done
        echo "covered=$covered" >> "$GITHUB_OUTPUT"
        echo "sibling reporter coverage since $started: covered=$covered"
    - name: Describe the incident
      if: steps.sibling.outputs.covered != '1'
      run: |
        {
          echo "The scheduled nightly-performance run did not finish green and no step-level reporter covered it."
          echo ""
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "If a more specific issue (fuzz crash, stress failure) was filed for this night, triage there; this entry exists so no red nightly is silent."
        } > "$RUNNER_TEMP/watchdog-body.md"
    - uses: ./.github/actions/report-failure-issue
      if: steps.sibling.outputs.covered != '1'
      with:
        label: nightly-performance-watchdog
        title: "Nightly performance run did not finish"
        body-file: ${{ runner.temp }}/watchdog-body.md
        token: ${{ secrets.GITHUB_TOKEN }}
