name: Build-Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMSDK_VERSION: 3.1.74
      WABT_VERSION: 1.0.36

    steps:
    - uses: actions/checkout@v4

    - name: Cache Emscripten SDK
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/emsdk
        key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

    - name: Install Emscripten SDK
      run: |
        EMSDK_DIR="${RUNNER_TOOL_CACHE}/emsdk"
        if [ ! -d "$EMSDK_DIR/.git" ]; then
          rm -rf "$EMSDK_DIR"
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
        fi
        cd "$EMSDK_DIR"
        git fetch --tags --quiet
        ./emsdk install "$EMSDK_VERSION"
        ./emsdk activate "$EMSDK_VERSION"
        echo "EMSDK=$EMSDK_DIR" >> "$GITHUB_ENV"

    - name: Cache WABT
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/wabt-${{ env.WABT_VERSION }}
        key: wabt-${{ runner.os }}-${{ env.WABT_VERSION }}

    - name: Install WABT
      run: |
        WABT_DIR="${RUNNER_TOOL_CACHE}/wabt-${WABT_VERSION}"
        if [ ! -x "$WABT_DIR/bin/wasm-strip" ]; then
          rm -rf "$WABT_DIR"
          mkdir -p "$WABT_DIR"
          curl -fsSL "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-ubuntu-20.04.tar.gz" \
            | tar -xz --strip-components=1 -C "$WABT_DIR"
        fi
        echo "$WABT_DIR/bin" >> "$GITHUB_PATH"

    - name: Configure
      run: |
        source "$EMSDK/emsdk_env.sh"
        ./configure

    - name: Build generated SQLite files
      run: |
        make sqlite3.c sqlite3.h sqlite3ext.h

    - name: Build native DoltLite
      run: |
        mkdir -p build
        cd build
        ../configure
        make doltlite

    - name: Build DoltLite wasm targets
      run: |
        source "$EMSDK/emsdk_env.sh"
        make -C ext/wasm fiddle npm

    - name: Smoke test DoltLite wasm runtime
      run: |
        node ext/wasm/test-doltlite-smoke.mjs

    - name: End-to-end test DoltLite wasm writes
      run: |
        node ext/wasm/test-doltlite-write-e2e.mjs

    - name: Roundtrip exported wasm DB into native DoltLite
      run: |
        node ext/wasm/test-doltlite-export-roundtrip.mjs

    - name: Build wasm distribution zip
      run: |
        source "$EMSDK/emsdk_env.sh"
        make -C ext/wasm dist

    - name: Upload wasm artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-build
        path: |
          ext/wasm/jswasm/*
          ext/wasm/sqlite-wasm-*.zip

  build-and-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            runs-on: ubuntu-latest
          - platform: windows
            runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      if: matrix.platform == 'ubuntu'
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Install Windows dependencies
      if: matrix.platform == 'windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-tcl mingw-w64-x86_64-zlib make perl tcl

    - name: Install Dolt
      if: matrix.platform == 'ubuntu'
      run: |
        curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz \
          | sudo tar -xz -C /usr/local --strip-components=1
        dolt version

    - name: Configure
      if: matrix.platform == 'ubuntu'
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Configure Windows
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        mkdir -p build && cd build
        ../configure

    - name: Build
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        set -o pipefail
        {
          make DOLTLITE_PROLLY_CHECK=1 doltlite
          make DOLTLITE_PROLLY_CHECK=1 doltlite-lib
          # doltlite_parity.sh compares against the package-built stock
          # SQLite CLI instead of whatever sqlite3 the runner image provides.
          make DOLTLITE_PROLLY=0 sqlite3
          # Stock SQLite lib for concurrent_branch_test
          make libsqlite3.a USE_AMALGAMATION=0
        } 2>&1 | tee build.log
        DOLTLITE_CHECK_AMALGAMATION=0 bash ../test/assert_doltlite_artifacts.sh .
        if grep -E "warning:" build.log; then
          echo "::error::compiler warnings in the build (see above); the build must be warning-free"
          exit 1
        fi

    - name: Build Windows
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        make -j$(nproc) DOLTLITE_PROLLY_CHECK=1 doltlite.exe doltlite-lib
        DOLTLITE_CHECK_AMALGAMATION=0 DOLTLITE_CHECK_SHARED=0 bash ../test/assert_doltlite_artifacts.sh .
        cp -f "$(command -v sqlite3)" sqlite3

    - name: Lint
      if: matrix.platform == 'ubuntu'
      run: cd build && make lint
      timeout-minutes: 1

    - name: Basic smoke tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        rm -f /tmp/build_test_smoke_basic.db /tmp/build_test_smoke_basic.db-wal /tmp/build_test_smoke_basic.db-lock
        test "$(./doltlite :memory: "SELECT 1;")" = "1"
        ./doltlite /tmp/build_test_smoke_basic.db "CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT); INSERT INTO t VALUES(1,'a'); SELECT count(*) FROM t;"
        test "$(./doltlite /tmp/build_test_smoke_basic.db "SELECT v FROM t WHERE id=1;")" = "a"
        ./doltlite /tmp/build_test_smoke_basic.db "SELECT dolt_commit('-A','-m','c1');"
        test "$(./doltlite /tmp/build_test_smoke_basic.db "SELECT count(*) FROM dolt_log;")" = "2"
      timeout-minutes: 2

    - name: Basic smoke tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        rm -f /tmp/build_test_smoke_basic.db /tmp/build_test_smoke_basic.db-wal /tmp/build_test_smoke_basic.db-lock
        test "$(./doltlite.exe :memory: "SELECT 1;")" = "1"
        ./doltlite.exe /tmp/build_test_smoke_basic.db "CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT); INSERT INTO t VALUES(1,'a'); SELECT count(*) FROM t;"
        test "$(./doltlite.exe /tmp/build_test_smoke_basic.db "SELECT v FROM t WHERE id=1;")" = "a"
        ./doltlite.exe /tmp/build_test_smoke_basic.db "SELECT dolt_commit('-A','-m','c1');"
        test "$(./doltlite.exe /tmp/build_test_smoke_basic.db "SELECT count(*) FROM dolt_log;")" = "2"
      timeout-minutes: 2

    - name: GC smoke tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        rm -f /tmp/build_test_smoke_gc.db /tmp/build_test_smoke_gc.db-wal /tmp/build_test_smoke_gc.db-lock
        ./doltlite /tmp/build_test_smoke_gc.db "CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT); INSERT INTO t VALUES(1,'a'); SELECT dolt_commit('-A','-m','c1'); SELECT dolt_gc(); SELECT count(*) FROM t;"
        bash ../test/doltlite_gc.sh
        bash ../test/doltlite_gc_session_state.sh
        bash ../test/doltlite_pragma_page_count.sh
      timeout-minutes: 5

    - name: GC smoke tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        rm -f /tmp/build_test_smoke_gc.db /tmp/build_test_smoke_gc.db-wal /tmp/build_test_smoke_gc.db-lock
        ./doltlite.exe /tmp/build_test_smoke_gc.db "CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT); INSERT INTO t VALUES(1,'a'); SELECT dolt_commit('-A','-m','c1'); SELECT dolt_gc(); SELECT count(*) FROM t;"
        bash ../test/doltlite_gc.sh
        bash ../test/doltlite_gc_session_state.sh
        bash ../test/doltlite_pragma_page_count.sh
      timeout-minutes: 5

    # -- Doltlite feature tests ------------------------------

    - name: Doltlite feature tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/run_doltlite_tests.sh
      timeout-minutes: 20

    - name: Correctness regression tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/correctness_test.sh ./doltlite
      timeout-minutes: 10

    - name: Index operation tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/index_test.sh ./doltlite
      timeout-minutes: 5

    # All oracle tests (vc + sql) run in the parallel oracle-tests job

    - name: Large-scale test (10K rows)
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/large_scale_test.sh ./doltlite --quick
      timeout-minutes: 5

    - name: Chunk size distribution
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/chunk_distribution_test.sh ./doltlite
      timeout-minutes: 5

    - name: Multi-table test
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/multi_table_test.sh ./doltlite --quick
      timeout-minutes: 5

    - name: Diff tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/diff_test.sh ./doltlite
      timeout-minutes: 10

    - name: Config tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/config_test.sh ./doltlite
      timeout-minutes: 2

    - name: BLAKE3 known-answer test
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/blake3_kat_test.sh ./doltlite
      timeout-minutes: 2

    - name: Windows Doltlite feature tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        export DLTEST_STRIP_CR=1
        tests=(
          ../test/doltlite_parity.sh
          ../test/doltlite_commit.sh
          ../test/doltlite_staging.sh
          ../test/doltlite_workspace.sh
          ../test/doltlite_branch.sh
          ../test/doltlite_open_branch.sh
          ../test/doltlite_tag.sh
          ../test/doltlite_merge.sh
          ../test/doltlite_conflicts.sh
          ../test/doltlite_diff_table.sh
          ../test/doltlite_schema_diff.sh
          ../test/doltlite_schema_merge.sh
          ../test/doltlite_cherry_pick.sh
          ../test/doltlite_revert_dirty.sh
          ../test/doltlite_conflict_rows.sh
          ../test/doltlite_reset.sh
          ../test/doltlite_working_set.sh
          ../test/doltlite_gc.sh
          ../test/doltlite_gc_session_state.sh
          ../test/doltlite_gc_scale.sh
          ../test/doltlite_vacuum.sh
          ../test/doltlite_memory_db.sh
          ../test/doltlite_dbpage.sh
          ../test/doltlite_record_format.sh
          ../test/doltlite_rollback_durability.sh
          ../test/doltlite_storage_locking.sh
          ../test/chunk_physical_dups_test.sh
          ../test/doltlite_open_sqlite_file.sh
          ../test/doltlite_comparison.sh
          ../test/doltlite_merge_ignore_corners.sh
          ../test/doltlite_pragma_auto_vacuum.sh
          ../test/doltlite_pragma_journal_mode.sh
          ../test/doltlite_pragma_memory_journal_mode.sh
          ../test/doltlite_pragma_page_count.sh
          ../test/doltlite_pragma_wal_checkpoint.sh
          ../test/doltlite_row_count_estimate.sh
          ../test/doltlite_schema_cookie.sh
        )
        for test in "${tests[@]}"; do
          echo "━━━ ${test} ━━━"
          bash "$test"
        done
      timeout-minutes: 20

    - name: Windows correctness regression tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        bash ../test/correctness_test.sh ./doltlite
        bash ../test/index_test.sh ./doltlite
      timeout-minutes: 15

    - name: Windows scale and feature tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        bash ../test/large_scale_test.sh ./doltlite --quick
        bash ../test/chunk_distribution_test.sh ./doltlite
        bash ../test/multi_table_test.sh ./doltlite --quick
        bash ../test/diff_test.sh ./doltlite
        bash ../test/config_test.sh ./doltlite
        bash ../test/blake3_kat_test.sh ./doltlite
      timeout-minutes: 30

    - name: Remote integration tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/remote_test.sh ./doltlite
      timeout-minutes: 5

    # -- C/Python/Go integration tests -----------------------

    - name: C integration tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        # Quickstart
        gcc -o quickstart ../examples/quickstart.c -I. libdoltlite.a -lpthread -lz -lm
        ./quickstart
        # Concurrent branch test
        cc -g -O0 -I. -I../src -DDOLTLITE_PROLLY=1 -D_HAVE_SQLITE_CONFIG_H -DBUILD_sqlite \
          -o concurrent_branch_test ../test/concurrent_branch_test.c \
          libsqlite3.a -lz -lpthread -lm
        ./concurrent_branch_test

    - name: Concurrent write test
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        gcc -g -O0 -I. -o concurrent_write_test ../test/concurrent_write_test.c \
          libdoltlite.a -lz -lpthread -lm
        ./concurrent_write_test

    - name: Native crash recovery test
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        cc -I. -o crash_recovery_test ../test/crash_recovery_test.c \
          libdoltlite.a -lz -lpthread -lm
        ./crash_recovery_test
      timeout-minutes: 10

    - name: Prepared statement reuse test
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        gcc -g -O0 -I. -o prepared_stmt_reuse_test ../test/prepared_stmt_reuse_test.c \
          libdoltlite.a -lz -lpthread -lm
        ./prepared_stmt_reuse_test

    # Wires the previously-orphan C tests into CI. All tests in
    # test/run_c_tests.sh are gating and must pass.
    - name: Orphan C tests
      if: matrix.platform == 'ubuntu'
      run: cd build && make c-tests
      timeout-minutes: 15

    - name: Python integration test
      if: matrix.platform == 'ubuntu'
      run: cd build && LD_PRELOAD=./libdoltlite.so python3 ../examples/quickstart.py

    - name: Go integration test
      if: matrix.platform == 'ubuntu'
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - if: matrix.platform == 'ubuntu'
      run: |
        cd examples/go
        CGO_CFLAGS="-I../../build" CGO_LDFLAGS="../../build/libdoltlite.a -lz -lpthread -lm" \
          go build -tags libsqlite3 -o quickstart .
        ./quickstart
