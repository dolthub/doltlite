name: Build-Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMSDK_VERSION: 3.1.74
      WABT_VERSION: 1.0.36

    steps:
    - uses: actions/checkout@v4

    - name: Cache Emscripten SDK
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/emsdk
        key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

    - name: Install Emscripten SDK
      run: |
        EMSDK_DIR="${RUNNER_TOOL_CACHE}/emsdk"
        if [ ! -d "$EMSDK_DIR/.git" ]; then
          rm -rf "$EMSDK_DIR"
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
        fi
        cd "$EMSDK_DIR"
        git fetch --tags --quiet
        ./emsdk install "$EMSDK_VERSION"
        ./emsdk activate "$EMSDK_VERSION"
        echo "EMSDK=$EMSDK_DIR" >> "$GITHUB_ENV"

    - name: Cache WABT
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/wabt-${{ env.WABT_VERSION }}
        key: wabt-${{ runner.os }}-${{ env.WABT_VERSION }}

    - name: Install WABT
      run: |
        WABT_DIR="${RUNNER_TOOL_CACHE}/wabt-${WABT_VERSION}"
        if [ ! -x "$WABT_DIR/bin/wasm-strip" ]; then
          rm -rf "$WABT_DIR"
          mkdir -p "$WABT_DIR"
          curl -fsSL "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-ubuntu-20.04.tar.gz" \
            | tar -xz --strip-components=1 -C "$WABT_DIR"
        fi
        echo "$WABT_DIR/bin" >> "$GITHUB_PATH"

    - name: Configure
      run: |
        source "$EMSDK/emsdk_env.sh"
        ./configure

    - name: Build generated SQLite files
      run: |
        make sqlite3.c sqlite3.h sqlite3ext.h

    - name: Build native DoltLite
      run: |
        mkdir -p build
        cd build
        ../configure
        make doltlite

    - name: Build DoltLite wasm targets
      run: |
        source "$EMSDK/emsdk_env.sh"
        make -C ext/wasm fiddle npm

    - name: Smoke test DoltLite wasm runtime
      run: |
        node ext/wasm/test-doltlite-smoke.mjs

    - name: End-to-end test DoltLite wasm writes
      run: |
        node ext/wasm/test-doltlite-write-e2e.mjs

    - name: Roundtrip exported wasm DB into native DoltLite
      run: |
        node ext/wasm/test-doltlite-export-roundtrip.mjs

    - name: Build wasm distribution zip
      run: |
        source "$EMSDK/emsdk_env.sh"
        make -C ext/wasm dist

    - name: Upload wasm artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-build
        path: |
          ext/wasm/jswasm/*
          ext/wasm/sqlite-wasm-*.zip

  build-and-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            runs-on: ubuntu-latest
          - platform: windows
            runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      if: matrix.platform == 'ubuntu'
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Install Windows dependencies
      if: matrix.platform == 'windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-tcl mingw-w64-x86_64-zlib make perl tcl

    - name: Install Dolt
      if: matrix.platform == 'ubuntu'
      run: |
        curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz \
          | sudo tar -xz -C /usr/local --strip-components=1
        dolt version

    - name: Configure
      if: matrix.platform == 'ubuntu'
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Configure Windows
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        mkdir -p build && cd build
        ../configure

    - name: Build
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        make DOLTLITE_PROLLY_CHECK=1 doltlite
        make DOLTLITE_PROLLY_CHECK=1 doltlite-lib
        make DOLTLITE_PROLLY_CHECK=1 testfixture
        DOLTLITE_CHECK_AMALGAMATION=0 bash ../test/assert_doltlite_artifacts.sh .
        # doltlite_parity.sh compares against the package-built stock
        # SQLite CLI instead of whatever sqlite3 the runner image provides.
        make DOLTLITE_PROLLY=0 sqlite3
        # Stock SQLite lib for concurrent_branch_test
        make libsqlite3.a USE_AMALGAMATION=0

    - name: Build Windows
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        make -j$(nproc) DOLTLITE_PROLLY_CHECK=1 doltlite.exe doltlite-lib
        DOLTLITE_CHECK_AMALGAMATION=0 DOLTLITE_CHECK_SHARED=0 bash ../test/assert_doltlite_artifacts.sh .
        cp -f "$(command -v sqlite3)" sqlite3

    - name: Lint
      if: matrix.platform == 'ubuntu'
      run: cd build && make lint
      timeout-minutes: 1

    - name: Basic smoke tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        rm -f /tmp/build_test_smoke_basic.db /tmp/build_test_smoke_basic.db-wal /tmp/build_test_smoke_basic.db-lock
        test "$(./doltlite :memory: "SELECT 1;")" = "1"
        ./doltlite /tmp/build_test_smoke_basic.db "CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT); INSERT INTO t VALUES(1,'a'); SELECT count(*) FROM t;"
        test "$(./doltlite /tmp/build_test_smoke_basic.db "SELECT v FROM t WHERE id=1;")" = "a"
        ./doltlite /tmp/build_test_smoke_basic.db "SELECT dolt_commit('-A','-m','c1');"
        test "$(./doltlite /tmp/build_test_smoke_basic.db "SELECT count(*) FROM dolt_log;")" = "2"
      timeout-minutes: 2

    - name: Basic smoke tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        rm -f /tmp/build_test_smoke_basic.db /tmp/build_test_smoke_basic.db-wal /tmp/build_test_smoke_basic.db-lock
        test "$(./doltlite.exe :memory: "SELECT 1;")" = "1"
        ./doltlite.exe /tmp/build_test_smoke_basic.db "CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT); INSERT INTO t VALUES(1,'a'); SELECT count(*) FROM t;"
        test "$(./doltlite.exe /tmp/build_test_smoke_basic.db "SELECT v FROM t WHERE id=1;")" = "a"
        ./doltlite.exe /tmp/build_test_smoke_basic.db "SELECT dolt_commit('-A','-m','c1');"
        test "$(./doltlite.exe /tmp/build_test_smoke_basic.db "SELECT count(*) FROM dolt_log;")" = "2"
      timeout-minutes: 2

    - name: GC smoke tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        rm -f /tmp/build_test_smoke_gc.db /tmp/build_test_smoke_gc.db-wal /tmp/build_test_smoke_gc.db-lock
        ./doltlite /tmp/build_test_smoke_gc.db "CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT); INSERT INTO t VALUES(1,'a'); SELECT dolt_commit('-A','-m','c1'); SELECT dolt_gc(); SELECT count(*) FROM t;"
        bash ../test/doltlite_gc.sh
        bash ../test/doltlite_gc_session_state.sh
        bash ../test/doltlite_pragma_page_count.sh
      timeout-minutes: 5

    - name: GC smoke tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        rm -f /tmp/build_test_smoke_gc.db /tmp/build_test_smoke_gc.db-wal /tmp/build_test_smoke_gc.db-lock
        ./doltlite.exe /tmp/build_test_smoke_gc.db "CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT); INSERT INTO t VALUES(1,'a'); SELECT dolt_commit('-A','-m','c1'); SELECT dolt_gc(); SELECT count(*) FROM t;"
        bash ../test/doltlite_gc.sh
        bash ../test/doltlite_gc_session_state.sh
        bash ../test/doltlite_pragma_page_count.sh
      timeout-minutes: 5

    # -- Doltlite feature tests ------------------------------

    - name: Doltlite feature tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/run_doltlite_tests.sh
      timeout-minutes: 20

    - name: Correctness regression tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/correctness_test.sh ./doltlite
      timeout-minutes: 10

    - name: Index operation tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/index_test.sh ./doltlite
      timeout-minutes: 5

    # All oracle tests (vc + sql) run in the parallel oracle-tests job

    - name: Large-scale test (10K rows)
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/large_scale_test.sh ./doltlite --quick
      timeout-minutes: 5

    - name: Chunk size distribution
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/chunk_distribution_test.sh ./doltlite
      timeout-minutes: 5

    - name: Multi-table test
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/multi_table_test.sh ./doltlite --quick
      timeout-minutes: 5

    - name: Diff tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/diff_test.sh ./doltlite
      timeout-minutes: 10

    - name: Config tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/config_test.sh ./doltlite
      timeout-minutes: 2

    - name: BLAKE3 known-answer test
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/blake3_kat_test.sh ./doltlite
      timeout-minutes: 2

    - name: Windows Doltlite feature tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        tests=(
          ../test/doltlite_parity.sh
          ../test/doltlite_staging.sh
          ../test/doltlite_diff_table.sh
          ../test/doltlite_schema_diff.sh
          ../test/doltlite_schema_merge.sh
          ../test/doltlite_revert_dirty.sh
          ../test/doltlite_conflict_rows.sh
          ../test/doltlite_gc.sh
          ../test/doltlite_gc_session_state.sh
          ../test/doltlite_gc_scale.sh
          ../test/doltlite_vacuum.sh
          ../test/doltlite_memory_db.sh
          ../test/doltlite_dbpage.sh
          ../test/doltlite_record_format.sh
          ../test/doltlite_rollback_durability.sh
          ../test/doltlite_storage_locking.sh
          ../test/chunk_physical_dups_test.sh
          ../test/doltlite_open_sqlite_file.sh
          ../test/doltlite_comparison.sh
          ../test/doltlite_merge_ignore_corners.sh
          ../test/doltlite_pragma_auto_vacuum.sh
          ../test/doltlite_pragma_journal_mode.sh
          ../test/doltlite_pragma_memory_journal_mode.sh
          ../test/doltlite_pragma_page_count.sh
          ../test/doltlite_pragma_wal_checkpoint.sh
          ../test/doltlite_row_count_estimate.sh
          ../test/doltlite_schema_cookie.sh
        )
        for test in "${tests[@]}"; do
          echo "━━━ ${test} ━━━"
          bash "$test"
        done
      timeout-minutes: 20

    - name: Windows correctness regression tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        bash ../test/correctness_test.sh ./doltlite
        bash ../test/index_test.sh ./doltlite
      timeout-minutes: 15

    - name: Windows scale and feature tests
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cd build
        bash ../test/large_scale_test.sh ./doltlite --quick
        bash ../test/chunk_distribution_test.sh ./doltlite
        bash ../test/multi_table_test.sh ./doltlite --quick
        bash ../test/diff_test.sh ./doltlite
        bash ../test/config_test.sh ./doltlite
        bash ../test/blake3_kat_test.sh ./doltlite
      timeout-minutes: 30

    - name: Remote integration tests
      if: matrix.platform == 'ubuntu'
      run: cd build && bash ../test/remote_test.sh ./doltlite
      timeout-minutes: 5

    # -- C/Python/Go integration tests -----------------------

    - name: C integration tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        # Quickstart
        gcc -o quickstart ../examples/quickstart.c -I. libdoltlite.a -lpthread -lz -lm
        ./quickstart
        # Concurrent branch test
        cc -g -O0 -I. -I../src -DDOLTLITE_PROLLY=1 -D_HAVE_SQLITE_CONFIG_H -DBUILD_sqlite \
          -o concurrent_branch_test ../test/concurrent_branch_test.c \
          libsqlite3.a -lz -lpthread -lm
        ./concurrent_branch_test

    - name: Concurrent write test
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        gcc -g -O0 -I. -o concurrent_write_test ../test/concurrent_write_test.c \
          libdoltlite.a -lz -lpthread -lm
        ./concurrent_write_test

    - name: Native crash recovery test
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        cc -I. -o crash_recovery_test ../test/crash_recovery_test.c \
          libdoltlite.a -lz -lpthread -lm
        ./crash_recovery_test
      timeout-minutes: 10

    - name: Prepared statement reuse test
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        gcc -g -O0 -I. -o prepared_stmt_reuse_test ../test/prepared_stmt_reuse_test.c \
          libdoltlite.a -lz -lpthread -lm
        ./prepared_stmt_reuse_test

    # Wires the previously-orphan C tests into CI. All tests in
    # test/run_c_tests.sh are gating and must pass.
    - name: Orphan C tests
      if: matrix.platform == 'ubuntu'
      run: cd build && make c-tests
      timeout-minutes: 15

    - name: Python integration test
      if: matrix.platform == 'ubuntu'
      run: cd build && LD_PRELOAD=./libdoltlite.so python3 ../examples/quickstart.py

    - name: Go integration test
      if: matrix.platform == 'ubuntu'
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - if: matrix.platform == 'ubuntu'
      run: |
        cd examples/go
        CGO_CFLAGS="-I../../build" CGO_LDFLAGS="../../build/libdoltlite.a -lz -lpthread -lm" \
          go build -tags libsqlite3 -o quickstart .
        ./quickstart

    # -- SQLite testfixture tests ----------------------------
    #
    # Every upstream sqlite testfixture file we know about is run.
    # Files that have a small number of expected divergences from
    # upstream behavior (because doltlite keys rows by user PK rather
    # than by sqlite's auto-allocated rowid since #358) record those
    # specific test names in test/known_testfixture_divergences.txt
    # and the runner enforces strict equality: any actual failure
    # not on the list is a regression, and any list entry that
    # stops failing is reported as needing removal. This keeps the
    # divergence list honest and lets us catch real bugs in tests
    # that USED to be skipped at the file level.

    - name: SQLite core tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        bash ../test/run_testfixture.sh "Core tests" 120 \
          insert select1 select2 select3 select4 delete update \
          trans where expr attach \
          coalesce conflict cse date join subquery view \
          between cast check limit null quote rowid sort types \
          types2 in in2 in3 in4 in5 in6 like like2 \
          minmax minmax2 minmax3 select5 select6 select7 \
          selectA selectB distinctagg enc count capi2 capi3 \
          collate1 collate2 collate3 collate4 \
          index intpkey \
          alter auth savepoint \
          fkey1 fkey2 fkey5 \
          trigger1 trigger2 triggerA triggerB triggerC

    - name: SQLite large tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        bash ../test/run_testfixture.sh "Large tests" 180 \
          func e_expr printf date randexpr1 enc4 \
          boundary1 boundary2 boundary3 select9

    - name: SQLite crash recovery tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        # crash.test is omitted: its crash-injection failure set is
        # nondeterministic run-to-run under doltlite, so it can't be gated
        # per-test (tracked with the other nondeterministic files in #1132).
        bash ../test/run_testfixture.sh "Crash recovery" 180 \
          crash2 crash3 crash4 crash5 crash6 crash7 crash8 crashM

    - name: SQLite fuzz tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        bash ../test/run_testfixture.sh "Fuzz tests" 120 \
          fuzz fuzz2 fuzz3 fuzz4

    - name: SQLite additional tests
      if: matrix.platform == 'ubuntu'
      run: |
        cd build
        bash ../test/run_testfixture.sh "Additional tests" 120 \
          window1 window2 window3 \
          json101 json102 json103 json104 json105 \
          aggnested aggorderby \
          affinity2 affinity3 \
          between distinct distinctagg \
          e_createtable e_delete e_insert e_select e_update e_fkey \
          func2 func3 hexlit icu intarray \
          orderby1 orderby2 orderby3 orderby4 \
          pragma pragma2 printf2 \
          schema schema2 schema3 schema4 \
          shared shared2 shared3 \
          speed1 substr table tempdb \
          vacuum vacuum2 \
          tkt-38cb5df375 tkt-9a8b09f8e6 tkt-99378177930f87bd \
          tkt-80e031a00f tkt-80ba201079 tkt-31338dca7e \
          tkt-7bbfb7d442 tkt-4dd95f6943 tkt-2d1a5c67d \
          tkt-f3e5abed55

  inherited-testfixture:
    name: inherited-testfixture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Build testfixture
      run: |
        cd build
        make DOLTLITE_PROLLY_CHECK=1 testfixture

    # Inherited upstream SQLite .test files that pass clean (or only with
    # already-recorded divergences) against doltlite. Swept and gated under
    # issue #1208 so they stop being silently un-run. Files that diverge,
    # crash, or hang are tracked there for triage. Nondeterministic-class
    # files (multi-threaded thread*, crash/fault-injection walcrash*/
    # writecrash/wal*fault) are intentionally excluded — same rationale as
    # the crash.test exclusion above; they flake run-to-run.
    - name: SQLite inherited tests
      run: |
        cd build
        bash ../test/run_testfixture.sh "Inherited tests" 90 \
          8_3_names aggerror aggfault alterauth alterauth2 alterdropcol2 alterlegacy altermalloc3 \
          alterqf altertab2 altertrig amatch1 analyze3 analyze4 analyze5 analyze6 \
          analyze7 analyze8 analyze9 analyzeC analyzeD analyzeE analyzeF analyzeG \
          analyzer1 atof1 atof2 atomic atomic2 attach4 auth2 auth3 \
          autoanalyze1 autoindex2 autoindex4 avfs backcompat badutf2 basexx1 bestindex1 \
          bestindex2 bestindex3 bestindex5 bestindex6 bestindex7 bestindex8 bestindex9 bestindexA \
          bestindexB bestindexC bestindexD bestindexE bestindexF bigmmap bigrow bind \
          bind2 bindxfer bitvec blob bloom1 boundary4 btree01 btree02 \
          capi3d capi3e carray01 carray02 carrayfault changes2 cksumvfs close \
          collate5 collate6 collate7 collate8 collateA collateB colname columncount \
          conflict2 contrib01 corrupt3 cost countofview coveridxscan csv01 ctime \
          cursorhint cursorhint2 dataversion1 date2 date3 date4 date5 dbdata \
          decimal delete3 delete4 e_blobbytes e_droptrigger e_dropview e_resolve emptytable \
          eqp eqp2 errofst1 eval exec exists existsexpr existsexpr2 \
          expr2 exprfault expridx1 filectrl filter1 filter2 filterfault fkey3 \
          fkey4 fkey6 fkey7 fkey8 fts-9fd058691 fts3aa fts3ab fts3ac \
          fts3ad fts3ae fts3af fts3ag fts3ah fts3aj fts3ak fts3al \
          fts3am fts3atoken fts3atoken2 fts3auto fts3aux1 fts3aux2 fts3b fts3c \
          fts3comp1 fts3corrupt fts3corrupt3 fts3corrupt5 fts3corrupt6 fts3d fts3defer fts3drop \
          fts3dropmod fts3e fts3expr fts3expr2 fts3expr3 fts3expr4 fts3expr5 fts3f \
          fts3first fts3integrity fts3join fts3matchinfo fts3matchinfo2 fts3misc fts3near fts3offsets \
          fts3prefix fts3prefix2 fts3query fts3rank fts3snippet2 fts3sort fts3tok_err fts3tok1 \
          fts3varint fts4docid fts4incr fts4intck1 fts4lastrowid fts4merge3 fts4min fts4noti \
          fts4record fts4rename fts4umlaut fts4unicode fts4upfrom func4 func5 func6 \
          func7 func8 func9 fuzz_malloc fuzz-oss1 fuzzer1 fuzzerfault gcfault \
          having hidden hook hook2 ieee754 imposter1 incrblob4 index2 \
          index4 index6 index7 index8 index9 indexA indexexpr1 indexexpr2 \
          indexexpr3 init insert2 insert3 insert4 insert5 insertfault instr \
          instrfault intreal ioerr5 ioerr6 istrue join2 join3 join4 \
          join6 join7 join8 join9 joinA joinC joinE joinF \
          joinH joinI json107 json108 json109 json501 json502 jsonb01 \
          keyword1 lastinsert laststmtchanges literal literal2 loadext loadext2 lock6 \
          lookaside malloc4 malloc5 malloc7 malloc8 malloc9 mallocB mallocE \
          mallocJ mallocM manydb mem5 memsubsys2 merge1 minmax4 misc2 \
          misc3 misc6 misuse mmap2 mmapfault multiplex3 mutex2 normalize \
          notify1 notify2 notify3 notnull2 nulls1 numindex1 offset1 orderby5 \
          orderby6 orderby7 orderby8 orderby9 orderbyA orderbyB ovfl pageropt \
          parser1 pcache pragma5 pragmafault prefixes progress ptrchng pushdown \
          qrf01 qrf02 qrf03 qrf05 qrf06 queryonly quickcheck quota-glob \
          quota2 rbu recover regexp1 regexp2 resolver01 returning1 round1 \
          rowhash rowvalue rowvalue2 rowvalue3 rowvalue4 rowvalue5 rowvalue6 rowvalue7 \
          rowvalue8 rowvalueA rowvaluevtab savepoint2 savepoint5 scanstatus scanstatus2 schema5 \
          schemafault seekscan1 select8 selectC selectD selectE selectF selectG \
          selectH session shared4 sharedB shell1 shell2 shell3 shell4 \
          shell5 shell6 shell7 shell8 shell9 shellA shellB skipscan3 \
          skipscan5 skipscan6 snapshot snapshot_fault snapshot_up snapshot2 snapshot3 snapshot4 \
          sort2 sorterref speed4p spellfix spellfix2 spellfix3 spellfix4 sqldiff1 \
          sqllog starschema1 stmtrand stmtvtab1 strict1 subquery2 subselect subtype1 \
          swarmvtab2 swarmvtab3 swarmvtabfault symlink2 tabfunc01 tableapi tableopts tempdb2 \
          temptable3 temptrigger timediff1 tkt-02a8e81d44 tkt-18458b1a tkt-26ff0c2d1e tkt-2a5629202f tkt-2d1a5c67d \
          tkt-2ea2425d34 tkt-31338dca7e tkt-313723c356 tkt-385a5b56b9 tkt-38cb5df375 tkt-3998683a16 tkt-3fe897352e tkt-4a03edc4c8 \
          tkt-4c86b126f2 tkt-4dd95f6943 tkt-4ef7e3cfca tkt-54844eea3f tkt-6bfb98dfc0 tkt-752e1646fc tkt-78e04e52ea tkt-7a31705a7e6 \
