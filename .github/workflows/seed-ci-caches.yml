# Warms the caches PR CI restores, so a cold cache costs a scheduled run
# rather than every pull request. Each cache is warmed by its own job: the
# work is independent, and one slow cache must not eat the budget of the
# others. A job is given at least the time CI already budgets for the same
# work, because a seed job only does that work when the cache is cold --- a
# budget that fits a warm run passes every time and times out on exactly the
# runs that matter.
name: Seed CI caches

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: seed-benchmark-cache
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: benchmark-base
    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential tcl-dev zlib1g-dev
    - name: Identify base build cache
      id: base-key
      run: |
        key=$(bash .github/scripts/benchmark-cache-key.sh benchmark-base)
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Restore base build
      id: base-cache
      uses: actions/cache@v4
      with:
        path: benchmark-baseline
        key: benchmark-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.base-key.outputs.key }}
    - name: Build base
      if: steps.base-cache.outputs.cache-hit != 'true'
      run: |
        rm -rf benchmark-baseline
        bash .github/scripts/build-optimized-benchmark.sh benchmark-base
        mkdir benchmark-baseline
        cp benchmark-base/build/doltlite benchmark-base/build/bench_timer_doltlite \
          benchmark-base/build/build.log benchmark-baseline/
    - name: Validate base build
      run: |
        test -x benchmark-baseline/doltlite
        test -x benchmark-baseline/bench_timer_doltlite
        test -s benchmark-baseline/build.log
        if grep -E "warning:" benchmark-baseline/build.log; then
          echo "::error::compiler warnings in optimized base build"
          exit 1
        fi

  compatibility:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: seed-compatibility-cache
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0
    - name: Install dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential tcl-dev zlib1g-dev
    - uses: ./.github/actions/compatibility-cache

  sqllogictest:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: seed-sqllogictest-cache
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
    - name: Install SQLLogicTest dependencies
      run: |
        bash .github/scripts/install-apt-deps.sh \
          build-essential fossil unixodbc-dev
    - uses: ./.github/actions/sqllogictest-cache

  development-debug:
    if: >-
      github.event_name != 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: seed-development-debug-cache
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
    - uses: ./.github/actions/development-debug-build
      with:
        seed: 'true'

  macos-packages:
    if: >-
      github.event_name != 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 35
    concurrency:
      group: seed-macos-package-cache
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false
    - name: Generate package inputs
      run: |
        brew install tcl-tk
        export PATH="$(brew --prefix tcl-tk)/bin:$PATH"
        mkdir -p build
        cd build
        ../configure
        make DOLTLITE_PROLLY=1 DOLTLITE_PROLLY_CHECK=1 sqlite3.c sqlite3.h
    - uses: ./.github/actions/macos-package-cache
      id: package-cache
    - name: Warm package caches
      if: steps.package-cache.outputs.cache-hit != 'true'
      run: bash .github/scripts/macos-package-tests.sh build
    - name: Warm native compiler cache
      if: steps.package-cache.outputs.cache-hit != 'true'
      run: |
        source .github/scripts/use-macos-compiler-cache.sh
        ccache --zero-stats
        cd build
        ../configure
        make -j"$(sysctl -n hw.logicalcpu)" libdoltlite.a
        bash ../.github/scripts/check-compiler-cache.sh

  macos-builds:
    if: >-
      github.event_name != 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 50
    concurrency:
      group: seed-macos-build-cache
      cancel-in-progress: false
    env:
      CFLAGS: -O2 -g -Werror
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
    - name: Install build dependencies
      run: brew install tcl-tk
    - uses: ./.github/actions/macos-build-cache
      id: checked-cache
      with:
        configuration: checked
        cflags: ${{ env.CFLAGS }}
    - name: Warm checked compiler cache
      if: steps.checked-cache.outputs.cache-hit != 'true'
      run: |
        rm -rf build
        mkdir build
        cd build
        export PATH="$(brew --prefix tcl-tk)/bin:$PATH"
        source ../.github/scripts/use-macos-compiler-cache.sh
        ../configure
        make -j"$(sysctl -n hw.logicalcpu)" DOLTLITE_PROLLY_CHECK=1 libdoltlite.a
        bash ../.github/scripts/check-compiler-cache.sh
    - uses: ./.github/actions/save-macos-build-cache
    - uses: ./.github/actions/macos-build-cache
      id: asan-cache
      with:
        configuration: asan
        cflags: -O1 -g -Werror -Wno-deprecated-declarations -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
        ldflags: -fsanitize=address,undefined
    - name: Warm sanitizer compiler cache
      if: steps.asan-cache.outputs.cache-hit != 'true'
      run: |
        rm -rf build
        mkdir build
        cd build
        export PATH="$(brew --prefix tcl-tk)/bin:$PATH"
        source ../.github/scripts/use-macos-compiler-cache.sh
        ../configure
        make -j"$(sysctl -n hw.logicalcpu)" \
          CFLAGS="-O1 -g -Werror -Wno-deprecated-declarations -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
          LDFLAGS="-fsanitize=address,undefined" libdoltlite.a
        bash ../.github/scripts/check-compiler-cache.sh
    - uses: ./.github/actions/save-macos-build-cache

  # Seeding is invisible when it breaks: the caches simply stay cold and PR CI
  # gets slower. Nothing downstream turns red, so the run has to report itself.
  # A whole-run cancellation kills this job too, which is what the weekly
  # nightly-heartbeat audit catches from outside.
  watchdog:
    needs: [benchmark, compatibility, sqllogictest, development-debug, macos-packages, macos-builds]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@v4
    - name: Describe the incident
      run: |
        {
          echo "A scheduled CI cache seeding run did not finish."
          echo ""
          echo "Every cache below is restored by PR CI and rebuilt from scratch"
          echo "when it is missing. A seed run that fails or times out leaves the"
          echo "cold cache in place, and the only symptom is that pull requests"
          echo "get slower, which nothing else reports."
          echo ""
          echo "| Cache | Result |"
          echo "| --- | --- |"
          echo "| benchmark base build | ${{ needs.benchmark.result }} |"
          echo "| compatibility references | ${{ needs.compatibility.result }} |"
          echo "| SQLLogicTest reference | ${{ needs.sqllogictest.result }} |"
          echo "| All-Debug compiler cache | ${{ needs.development-debug.result }} |"
          echo "| macOS package caches | ${{ needs.macos-packages.result }} |"
          echo "| macOS compiler caches | ${{ needs.macos-builds.result }} |"
          echo ""
          echo "A job that timed out is budgeted for less than the work it warms;"
          echo "compare it against the CI job that builds the same thing."
        } > "$RUNNER_TEMP/seed-watchdog-body.md"
    - uses: ./.github/actions/report-failure-issue
      with:
        label: seed-ci-caches
        title: "CI cache seeding did not finish"
        body-file: ${{ runner.temp }}/seed-watchdog-body.md
        token: ${{ secrets.GITHUB_TOKEN }}
