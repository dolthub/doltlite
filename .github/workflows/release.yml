name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Manual trigger from Actions tab for testing

permissions:
  contents: write

jobs:
  # ── Source artifacts (run once on Linux) ──────────────────
  source:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 3.1.74
      WABT_VERSION: 1.0.36
    steps:
    - uses: actions/checkout@v4

    - name: Cache Emscripten SDK
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/emsdk
        key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

    - name: Install Emscripten SDK
      run: |
        EMSDK_DIR="${RUNNER_TOOL_CACHE}/emsdk"
        if [ ! -d "$EMSDK_DIR/.git" ]; then
          rm -rf "$EMSDK_DIR"
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
        fi
        cd "$EMSDK_DIR"
        git fetch --tags --quiet
        ./emsdk install "$EMSDK_VERSION"
        ./emsdk activate "$EMSDK_VERSION"
        echo "EMSDK=$EMSDK_DIR" >> "$GITHUB_ENV"

    - name: Cache WABT
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/wabt-${{ env.WABT_VERSION }}
        key: wabt-${{ runner.os }}-${{ env.WABT_VERSION }}

    - name: Install WABT
      run: |
        WABT_DIR="${RUNNER_TOOL_CACHE}/wabt-${WABT_VERSION}"
        if [ ! -x "$WABT_DIR/bin/wasm-strip" ]; then
          rm -rf "$WABT_DIR"
          mkdir -p "$WABT_DIR"
          curl -fsSL "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-ubuntu-20.04.tar.gz" \
            | tar -xz --strip-components=1 -C "$WABT_DIR"
        fi
        echo "$WABT_DIR/bin" >> "$GITHUB_PATH"

    - name: Build amalgamation and wasm artifacts
      run: |
        source "$EMSDK/emsdk_env.sh"
        ./configure
        make sqlite3.c sqlite3.h sqlite3ext.h
        DOLTLITE_CHECK_CLI=0 DOLTLITE_CHECK_STATIC=0 DOLTLITE_CHECK_SHARED=0 \
          bash test/assert_doltlite_artifacts.sh .
        make -C ext/wasm dist
        # With DOLTLITE_PROLLY=1 (the default), mksqlite3c.tcl --doltlite weaves
        # the prolly storage engine and the version-control layer into sqlite3.c,
        # so this amalgamation is genuinely doltlite (dolt_commit/branch/merge,
        # dolt_diff, etc.) rather than stock SQLite.

    - name: Package amalgamation
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        mkdir doltlite-amalgamation-${VERSION}
        cp sqlite3.c doltlite-amalgamation-${VERSION}/doltlite.c
        cp sqlite3.h doltlite-amalgamation-${VERSION}/doltlite.h
        zip -r doltlite-amalgamation-${VERSION}.zip doltlite-amalgamation-${VERSION}/

    - name: Package autoconf source
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        # All files the autosetup-driven configure + make pipeline needs to
        # build doltlite, doltlite-remotesrv, and libdoltlite from a clean
        # extracted tarball with no git history. Validated by running
        # `./configure && make doltlite doltlite-remotesrv doltlite-lib`
        # against a tarball with exactly this file list.
        #
        # Stamp DOLTLITE_VERSION into a sidecar file so main.mk's
        # `$(shell git describe ...)` fallback doesn't end up as "dev"
        # when the tarball is extracted outside git.
        echo "v${VERSION}" > .dolt_release_version
        tar czf doltlite-autoconf-${VERSION}.tar.gz \
          --transform "s,^,doltlite-autoconf-${VERSION}/," \
          configure Makefile.in Makefile.linux-generic Makefile.msc main.mk \
          auto.def VERSION manifest manifest.tags manifest.uuid \
          pragma.h magic.txt lempar.c \
          sqlite3.pc.in sqlite.pc.in \
          src/ ext/ tool/ autosetup/ autoconf/ \
          sqlite3.c sqlite3.h sqlite3ext.h sqlite3session.h \
          .dolt_release_version
        rm .dolt_release_version

    - name: Package wasm distribution
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        WASM_ZIP=$(ls ext/wasm/sqlite-wasm-*.zip | head -1)
        cp "$WASM_ZIP" "doltlite-wasm-${VERSION}.zip"

    - name: Upload source artifacts
      uses: actions/upload-artifact@v4
      with:
        name: source
        path: |
          doltlite-amalgamation-*.zip
          doltlite-autoconf-*.tar.gz
          doltlite-wasm-*.zip

  # ── Binary builds (per-platform) ─────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            pkg_arch: amd64
            deb_multiarch: x86_64-linux-gnu
            nfpm_arch: x86_64
            ext: ""
            lib_ext: ".so"
            static_ext: ".a"
          - os: ubuntu-24.04-arm
            target: linux-arm64
            pkg_arch: arm64
            deb_multiarch: aarch64-linux-gnu
            nfpm_arch: arm64
            ext: ""
            lib_ext: ".so"
            static_ext: ".a"
          - os: macos-latest
            target: osx-arm64
            ext: ""
            lib_ext: ".dylib"
            static_ext: ".a"
          # Intel Mac (x86_64) artifact, cross-compiled on the Apple Silicon
          # runner via `-arch x86_64`. We don't use a macos-13 Intel runner:
          # those are scarce and queue unreliably, and a stuck osx-x64 leg
          # blocks the whole release (the release job needs the full matrix).
          # The build cleanly separates host tools (lemon/mkkeywordhash/jimsh,
          # built with bare $(B.cc), stay native arm64 and runnable) from the
          # target objects/link (take -arch x86_64 via CFLAGS/LDFLAGS), and the
          # SDK's libz is universal so `-lz` resolves the x86_64 slice.
          - os: macos-latest
            target: osx-x64
            cross_arch: "-arch x86_64"
            ext: ""
            lib_ext: ".dylib"
            static_ext: ".a"
          - os: windows-latest
            target: win-x64
            ext: ".exe"
            lib_ext: ".dll"
            static_ext: ".lib"

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install zlib || true

    - name: Configure and build (Unix)
      if: runner.os != 'Windows'
      env:
        # Empty for native targets; "-arch x86_64" for the cross-compiled
        # Intel Mac build (see the osx-x64 matrix entry).
        CROSS_ARCH: ${{ matrix.cross_arch }}
      run: |
        mkdir -p build && cd build
        ../configure
        if [ -n "$CROSS_ARCH" ]; then
          # Cross-compile the *target* compiler with the arch flag while pinning
          # B.cc (build-host tools: lemon, mkkeywordhash, jimsh) to the native
          # cc so they run on this arm64 runner. Overriding CC rather than
          # CFLAGS preserves configure's -O2/-dynamic/-DNDEBUG flags, and the
          # link inherits the arch via $(CC). The macOS SDK's libz is universal
          # so -lz resolves the x86_64 slice.
          make -j$(sysctl -n hw.ncpu) \
            CC="cc $CROSS_ARCH" B.cc="cc" \
            doltlite doltlite-remotesrv doltlite-lib
        else
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) doltlite doltlite-remotesrv doltlite-lib
        fi

    - name: Build (Windows / MSYS2)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib make tcl

    - name: Configure and build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        mkdir -p build && cd build
        ../configure
        make -j$(nproc) doltlite.exe doltlite-lib

    - name: Package CLI tools (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        DIR="doltlite-tools-${{ matrix.target }}-${VERSION}"
        mkdir -p "${DIR}"
        cp build/doltlite${{ matrix.ext }} "${DIR}/"
        cp build/doltlite-remotesrv${{ matrix.ext }} "${DIR}/" 2>/dev/null || true
        strip "${DIR}/doltlite${{ matrix.ext }}" 2>/dev/null || true
        strip "${DIR}/doltlite-remotesrv${{ matrix.ext }}" 2>/dev/null || true
        zip -r "${DIR}.zip" "${DIR}"

    - name: Package CLI tools (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        DIR="doltlite-tools-${{ matrix.target }}-${VERSION}"
        mkdir -p "${DIR}"
        cp build/doltlite${{ matrix.ext }} "${DIR}/"
        strip "${DIR}/doltlite${{ matrix.ext }}" 2>/dev/null || true
        7z a "${DIR}.zip" "${DIR}"

    - name: Ad-hoc codesign (macOS)
      if: runner.os == 'macOS'
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        DIR="doltlite-tools-${{ matrix.target }}-${VERSION}"
        codesign -s - --force "${DIR}/doltlite"
        codesign -s - --force "${DIR}/doltlite-remotesrv"
        # Re-zip with signed binaries
        rm -f "${DIR}.zip"
        zip -r "${DIR}.zip" "${DIR}"

    - name: Package libraries
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        DIR="doltlite-lib-${{ matrix.target }}-${VERSION}"
        mkdir -p "${DIR}"
        cp build/sqlite3.h "${DIR}/doltlite.h" 2>/dev/null || true
        cp src/doltlite_remotesrv.h "${DIR}/doltlite_remotesrv.h" 2>/dev/null || true
        cp build/libdoltlite${{ matrix.static_ext }} "${DIR}/" 2>/dev/null || true
        cp build/libdoltlite${{ matrix.lib_ext }} "${DIR}/" 2>/dev/null || true
        cp -P build/libdoltlite.so.0 "${DIR}/" 2>/dev/null || true
        if command -v zip >/dev/null 2>&1; then
          zip -r "${DIR}.zip" "${DIR}"
        else
          7z a "${DIR}.zip" "${DIR}"
        fi

    # Debian packages — built only on Linux. nfpm reads the per-package
    # yaml configs in packaging/nfpm/, substitutes ${VERSION} and ${PKG_ARCH}
    # and ${DEB_HOST_MULTIARCH}, and emits .deb files. We attach them to
    # the GitHub release alongside the tarballs so users can install with
    # `wget … && sudo dpkg -i doltlite_*.deb`.
    - name: Install nfpm (Linux)
      if: startsWith(matrix.target, 'linux-')
      run: |
        NFPM_VERSION=2.43.0
        curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz" | sudo tar -xz -C /usr/local/bin nfpm
        nfpm --version

    - name: Build Debian packages (Linux)
      if: startsWith(matrix.target, 'linux-')
      shell: bash
      env:
        VERSION: ${{ github.ref_name }}
        PKG_ARCH: ${{ matrix.pkg_arch }}
        DEB_HOST_MULTIARCH: ${{ matrix.deb_multiarch }}
      run: |
        # nfpm reads VERSION from env; strip the leading "v" so we ship
        # doltlite_0.10.3_amd64.deb, not doltlite_v0.10.3_amd64.deb.
        export VERSION="${VERSION#v}"
        mkdir -p dist
        # nfpm only expands ${VAR} placeholders in a fixed set of metadata
        # fields (name/version/arch/depends), not inside contents[].dst.
        # Pre-render the YAML through envsubst so /usr/lib/${DEB_HOST_MULTIARCH}/
        # picks up x86_64-linux-gnu vs aarch64-linux-gnu per matrix entry.
        for cfg in packaging/nfpm/*.yaml; do
          envsubst < "$cfg" > "/tmp/$(basename "$cfg")"
          nfpm pkg --config "/tmp/$(basename "$cfg")" --packager deb --target dist/
        done
        ls -la dist/

    - name: Upload binary artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.target }}
        path: |
          doltlite-tools-*.zip
          doltlite-lib-*.zip
          dist/*.deb

  # ── Package smoke test (.deb) ─────────────────────────────
  # Non-blocking sanity check: download the just-built linux-x64 .debs,
  # `dpkg -i` them on a clean ubuntu-latest, and assert `doltlite` runs
  # and `SELECT dolt_version()` reports the release tag. Catches the
  # class of regression where the build succeeds but the package itself
  # is broken (missing files, bad paths, undeclared deps, etc.) —
  # exactly what ba3685707e ("make the autoconf release tarball
  # actually build") would have caught earlier.
  #
  # Started as non-blocking on purpose: the `release` job below does NOT
  # depend on this. Promote to a required check once it has demonstrated
  # reliability across a few releases.
  package-smoke-deb:
    needs: build
    runs-on: ubuntu-latest
    # Only run when there are real artifacts to install — i.e., on a
    # tag push (where the binaries-linux-x64 artifact will have been
    # produced by `build`). Manual workflow_dispatch runs also produce
    # artifacts, so allow those too.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
    - name: Download linux-x64 binary artifacts
      uses: actions/download-artifact@v4
      with:
        name: binaries-linux-x64
        path: artifacts

    - name: Show downloaded artifacts
      run: |
        find artifacts -type f | sort
        ls -la artifacts/dist/ 2>/dev/null || true

    - name: Install .deb packages
      run: |
        # Install in dependency order: libdoltlite0 (runtime), then
        # libdoltlite-dev (headers), then doltlite (CLI). Each depends
        # on the previous via `Depends:` in the .deb metadata.
        sudo dpkg -i artifacts/dist/libdoltlite0_*.deb
        sudo dpkg -i artifacts/dist/libdoltlite-dev_*.deb
        sudo dpkg -i artifacts/dist/doltlite_*.deb
        # If any deps are missing, apt-get -f install would fix them;
        # surface that as a failure instead so we notice.
        dpkg -l | grep -E '^ii\s+(doltlite|libdoltlite)' || (echo "package not installed cleanly" && exit 1)

    - name: Verify installed files
      run: |
        # Sanity: each .deb's payload lands where we expect. Catches
        # paths drifting from the nfpm yaml without anyone noticing.
        test -x /usr/bin/doltlite
        test -x /usr/bin/doltlite-remotesrv
        test -f /usr/include/doltlite.h
        # We intentionally do NOT install /usr/include/sqlite3.h —
        # that path is owned by libsqlite3-dev (pre-installed on
        # ubuntu-latest) and shipping our copy there made `dpkg -i`
        # fail. Guard against regression: if sqlite3.h exists, it
        # must NOT be owned by libdoltlite-dev.
        if [ -e /usr/include/sqlite3.h ] \
           && dpkg -S /usr/include/sqlite3.h 2>/dev/null \
              | grep -q '^libdoltlite-dev:'; then
          echo "regression: libdoltlite-dev installs /usr/include/sqlite3.h"
          exit 1
        fi
        ldconfig -p | grep -q libdoltlite || (echo "libdoltlite.so.0 not registered with ldconfig" && exit 1)

    - name: Smoke test — doltlite CLI runs and reports version
      run: |
        # `SELECT dolt_version()` should match the tag we built from.
        # On workflow_dispatch (no tag), just assert the call returns
        # *something* non-empty rather than asserting an exact value.
        VERSION_OUT=$(doltlite :memory: 'SELECT dolt_version();')
        ENGINE_OUT=$(doltlite :memory: 'SELECT doltlite_engine();')
        echo "dolt_version() => ${VERSION_OUT}"
        echo "doltlite_engine() => ${ENGINE_OUT}"
        if [ -z "${VERSION_OUT}" ]; then
          echo "dolt_version() returned empty"
          exit 1
        fi
        if [ "${ENGINE_OUT}" != "prolly" ]; then
          echo "doltlite_engine() returned ${ENGINE_OUT}, expected prolly"
          exit 1
        fi
        if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
          EXPECTED="${GITHUB_REF_NAME#v}"
          # dolt_version() may include extra qualifiers; substring match
          # is enough to confirm the right binary is on PATH.
          case "${VERSION_OUT}" in
            *"${EXPECTED}"*) echo "version matches tag ${EXPECTED}" ;;
            *) echo "version ${VERSION_OUT} does not contain tag ${EXPECTED}"; exit 1 ;;
          esac
        fi

    - name: Smoke test — basic SQL works
      run: |
        # Trivial SQL plus a doltlite-specific call. If the shared lib
        # is mis-linked or a virtual table is missing, this fails fast.
        doltlite :memory: 'SELECT 1;'
        doltlite :memory: 'CREATE TABLE t(x INT); INSERT INTO t VALUES (1),(2); SELECT count(*) FROM t;'
        cat >/tmp/doltlite-installed-probe.c <<'EOF'
        #include <doltlite.h>
        #include <stdio.h>
        int main(void){
          sqlite3 *db = 0;
          sqlite3_stmt *st = 0;
          if( sqlite3_open(":memory:", &db)!=SQLITE_OK ) return 1;
          if( sqlite3_prepare_v2(db, "SELECT doltlite_engine()", -1, &st, 0)!=SQLITE_OK ) return 2;
          if( sqlite3_step(st)!=SQLITE_ROW ) return 3;
          printf("%s\n", sqlite3_column_text(st, 0));
          sqlite3_finalize(st);
          sqlite3_close(db);
          return 0;
        }
        EOF
        cc /tmp/doltlite-installed-probe.c -ldoltlite -lz -lpthread -lm -o /tmp/doltlite-installed-probe
        test "$(/tmp/doltlite-installed-probe)" = "prolly"

  # ── Run benchmarks ────────────────────────────────────────
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y tcl-dev build-essential zlib1g-dev python3

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Build doltlite and stock SQLite
      run: |
        cd build
        make doltlite
        make doltlite-lib
        cc -O2 -I. -I../src -o bench_timer_doltlite ../test/sysbench_timer.c libdoltlite.a -lpthread -lz -lm
        make DOLTLITE_PROLLY=0 sqlite3 sqlite3.o
        cc -O2 -I. -I../src -o bench_timer_sqlite ../test/sysbench_timer.c sqlite3.o -lpthread -lz -lm

    - name: Run benchmarks
      run: |
        cd build
        BENCH_ROWS=100000 BENCH_RUNS=5 BENCH_SECTION_MODE=wrapped bash ../test/sysbench_compare.sh > /tmp/bench_classic.md
        sed -n '/### File-Backed/,/^_/p' /tmp/bench_classic.md > /tmp/bench_results.md

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark
        path: /tmp/bench_results.md

  # ── Cross-version compatibility gate ──────────────────────
  # Databases created by prior releases must open and pass feature smoke
  # tests when the on-disk format signature is unchanged, and must be
  # refused cleanly when it differs. A format change without a minor
  # version bump fails this job, which blocks the release.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y tcl-dev build-essential zlib1g-dev

    - name: Cache old-version binaries
      uses: actions/cache@v4
      with:
        path: .compat-cache
        key: compat-bins-${{ runner.os }}-${{ github.ref_name }}
        restore-keys: |
          compat-bins-${{ runner.os }}-

    - name: Configure
      run: |
        mkdir -p build && cd build
        TCL_CONFIG=$(find /usr -path '/usr/share/miniconda/*' -prune -o -name tclConfig.sh -print 2>/dev/null | head -1)
        if [ -n "$TCL_CONFIG" ]; then
          ../configure --with-tcl=$(dirname $TCL_CONFIG)
        else
          ../configure
        fi

    - name: Build doltlite
      run: cd build && make -j4 doltlite

    - name: Cross-version compatibility tests
      run: bash test/doltlite_compat_test.sh build/doltlite

  # ── Create GitHub release ─────────────────────────────────
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [source, build, benchmark, compat]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        # Collect all zips, tarballs, and .deb files
        find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" \) -exec mv {} . \;
        ls -la *.zip *.tar.gz *.deb install.sh 2>/dev/null || ls -la *.zip *.tar.gz install.sh

        # Create release if it doesn't already exist (may have been
        # created manually with release notes before the workflow ran)
        if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
          gh release create "${GITHUB_REF_NAME}" \
            --title "Doltlite ${VERSION}" \
            --generate-notes
        fi

        # Upload artifacts to the release
        ASSETS=$(find . -maxdepth 1 \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" -o -name "install.sh" \) -print)
        echo "Uploading: ${ASSETS}"
        gh release upload "${GITHUB_REF_NAME}" ${ASSETS} --clobber

    - name: Append benchmark to release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BENCH="artifacts/benchmark/bench_results.md"
        if [ -f "$BENCH" ]; then
          EXISTING=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          APPEND=$(printf '\n## Benchmark / int-keys (100K rows, Linux x64)\n\n'; cat "$BENCH")
          printf '%s\n%s' "$EXISTING" "$APPEND" > /tmp/release_body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file /tmp/release_body.md
        fi

  # ── Trigger binding releases ─────────────────────────────
  # The node and python bindings publish from tag pushes in their own
  # repositories. After the core doltlite release is created and all
  # release assets are uploaded, bump each binding package to the same
  # version, push that commit to its main branch, then push the matching
  # release tag. The tag push starts each binding repo's publish workflow.
  release-bindings:
    if: github.event_name != 'workflow_dispatch'
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      VERSION: ${{ github.ref_name }}
    steps:
    - name: Check release bot token
      run: |
        if [ -z "${GH_TOKEN}" ]; then
          echo "RELEASE_BOT_TOKEN is required to push commits and tags to doltlite-node and doltlite-python"
          exit 1
        fi
        gh auth status
        gh auth setup-git

    - name: Confirm core release assets are available
      run: |
        version="${VERSION#v}"
        gh release view "${VERSION}" --repo dolthub/doltlite --json assets --jq '.assets[].name' > /tmp/assets.txt
        grep -qx "doltlite-autoconf-${version}.tar.gz" /tmp/assets.txt
        grep -qx "doltlite-tools-linux-x64-${version}.zip" /tmp/assets.txt
        grep -qx "doltlite-tools-osx-arm64-${version}.zip" /tmp/assets.txt
        grep -qx "doltlite-tools-win-x64-${version}.zip" /tmp/assets.txt

    - name: Configure git identity
      run: |
        git config --global user.name "DoltHub Release Bot"
        git config --global user.email "releases@dolthub.com"

    - name: Release doltlite-node
      run: |
        set -euo pipefail
        version="${VERSION#v}"

        if gh api "repos/dolthub/doltlite-node/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
          echo "doltlite-node ${VERSION} already exists; skipping"
          exit 0
        fi

        gh repo clone dolthub/doltlite-node doltlite-node
        cd doltlite-node
        git checkout main
        git pull --ff-only origin main

        node <<'NODE'
        const fs = require("fs");
        const version = process.env.VERSION.slice(1);
        for (const file of ["package.json", "package-lock.json"]) {
          const data = JSON.parse(fs.readFileSync(file, "utf8"));
          data.version = version;
          if (data.packages && data.packages[""]) {
            data.packages[""].version = version;
          }
          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
        }
        NODE

        if ! git diff --quiet; then
          git add package.json package-lock.json
          git commit -m "Bump version to ${version} to match doltlite ${VERSION}"
          git push origin main
        fi

        git tag "${VERSION}"
        git push origin "${VERSION}"

    - name: Release doltlite-python
      run: |
        set -euo pipefail
        version="${VERSION#v}"

        if gh api "repos/dolthub/doltlite-python/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
          echo "doltlite-python ${VERSION} already exists; skipping"
          exit 0
        fi

        gh repo clone dolthub/doltlite-python doltlite-python
        cd doltlite-python
        git checkout main
        git pull --ff-only origin main

        python3 <<'PY'
        from pathlib import Path
        import os
        import re

        version = os.environ["VERSION"][1:]

        path = Path("pyproject.toml")
        text = path.read_text()
        text = re.sub(r'version = "[^"]+"', f'version = "{version}"', text, count=1)
        text = re.sub(
            r"post-releases: [0-9.]+\.post1, [0-9.]+\.post2, etc\.",
            f"post-releases: {version}.post1, {version}.post2, etc.",
            text,
            count=1,
        )
        path.write_text(text)

        path = Path("scripts/build-libdoltlite.sh")
        text = path.read_text()
        ref_line = 'DOLTLITE_REF="${' + f'DOLTLITE_REF:-v{version}' + '}"'
        text = re.sub(r'DOLTLITE_REF="\$\{DOLTLITE_REF:-v[^}]+\}"', ref_line, text, count=1)
        path.write_text(text)

        path = Path("src/doltlite/__init__.py")
        text = path.read_text()
        text = re.sub(r'__version__ = "[^"]+"', f'__version__ = "{version}"', text, count=1)
        path.write_text(text)
        PY

        if ! git diff --quiet; then
          git add pyproject.toml scripts/build-libdoltlite.sh src/doltlite/__init__.py
          git commit -m "Bump package to ${version}"
          git push origin main
        fi

        git tag "${VERSION}"
        git push origin "${VERSION}"
