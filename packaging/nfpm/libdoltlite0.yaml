# nfpm config for libdoltlite0 — the runtime shared library, mirroring
# what `libsqlite3-0` ships. Co-installable across major versions
# (the `0` suffix is the ABI version, fixed at 0 until a breaking change).
name: libdoltlite0
arch: "${PKG_ARCH}"
platform: linux
version: "${VERSION}"
section: libs
priority: optional
maintainer: DoltHub <team@dolthub.com>
description: |
  DoltLite shared library — runtime support for programs that link
  against -ldoltlite. Includes the prolly-tree storage engine, BLAKE3
  hashing, and the Dolt version-control SQL functions.
vendor: DoltHub
homepage: https://github.com/dolthub/doltlite
license: Apache-2.0

depends:
  - libc6
  - zlib1g

contents:
  # The runtime file ships under its SONAME-matching name so that
  # dlopen("libdoltlite.so.0") (Python ctypes, Node's process.dlopen,
  # anything respecting SONAME) finds it. The unversioned symlink
  # libdoltlite.so lives in libdoltlite-dev, mirroring how libsqlite3-0
  # and libsqlite3-dev partition the files in Debian.
  - src: build/libdoltlite.so
    dst: /usr/lib/${DEB_HOST_MULTIARCH}/libdoltlite.so.0
    file_info:
      mode: 0644
  - src: LICENSE.md
    dst: /usr/share/doc/libdoltlite0/copyright
